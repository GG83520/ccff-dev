    sdpEnvoyerDFCI(span.getAttribute('data-code'));
  });

  // Handler délégué pour les boutons tactiques dans les popups DFCI
  // CAPTURE=true : s'exécute AVANT Leaflet qui fermerait le popup sur mousedown
  document.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    var btn = e.target.closest('.tactique-btn[data-type]');
    if (!btn) return;
    var container = btn.closest('.tactique-btns');
    if (!container) return;
    // Lire toutes les données AVANT que Leaflet ferme le popup
    var lat  = parseFloat(container.getAttribute('data-lat'));
    var lon  = parseFloat(container.getAttribute('data-lon'));
    var dfci = container.getAttribute('data-dfci');
    var comm = container.getAttribute('data-commune') || '';
    var type = btn.getAttribute('data-type');
    // Empêcher Leaflet de fermer le popup avant qu'on ait terminé
    e.stopPropagation();
    e.preventDefault();
    if (type === 'engagement') {
      initRotationMode(type, lat, lon, dfci, container, btn);
    } else if (type === 'propagation') {
      initPropagationMode(lat, lon, dfci, container, btn);
    } else {
      // Fermer le popup manuellement après avoir lu les données
      setTimeout(function() { map.closePopup(); }, 10);
      deposerMarqueur(type, lat, lon, dfci, container);
    }
  }, true);  // true = capture phase — avant Leaflet
  document.addEventListener('click', function(e) {
    // Effacer groupe
    var btnG = e.target.closest('.btn-suppr-groupe');
    if (btnG) {
      supprimerGroupe(btnG.getAttribute('data-type'), parseInt(btnG.getAttribute('data-slot')) || 0);
    }
  });

function initZoomend() {
  map.on('zoomend', function() {
    dfciUpdateZoom();
    var opacity = communeFillOpacity(map.getZoom());
    if (dfciState[1].commune)   dfciState[1].commune.setStyle({fillOpacity:opacity});
    if (dfciState[1].highlight) dfciState[1].highlight.setStyle({fillOpacity:opacity});
  });
}

function clearCommuneSearch() {
  var inp = document.getElementById('commune-input');
  var sugg = document.getElementById('commune-sugg');
  if (inp) inp.value = '';
  if (sugg) { sugg.style.display='none'; sugg.innerHTML=''; }
  if (window._communeMarker) { map.removeLayer(window._communeMarker); window._communeMarker = null; }
}

function initCommuneSearch() {
  var inp = document.getElementById('commune-input');
  var sugg = document.getElementById('commune-sugg');
  if (!inp || !sugg || typeof COMMUNES_VAR === 'undefined') return;
  inp.addEventListener('input', function() {
    // Recherche insensible à la casse, cherche n'importe où dans le nom
    var val = this.value.trim().toLowerCase();
    sugg.innerHTML = '';
    if (val.length < 2) { sugg.style.display='none'; return; }
    var matches = COMMUNES_VAR.filter(function(c) {
      return c.nom.toLowerCase().indexOf(val) !== -1;
    }).sort(function(a, b) {
      // Priorité : commence par le terme cherché
      var ai = a.nom.toLowerCase().indexOf(val);
      var bi = b.nom.toLowerCase().indexOf(val);
      return ai - bi;
    }).slice(0, 10);
    if (!matches.length) { sugg.style.display='none'; return; }
    matches.forEach(function(c) {
      var div = document.createElement('div');
      div.className = 'dfci-sugg-item';
      div.textContent = c.nom + (c.cp?' ('+c.cp+')':'');
      div.addEventListener('click', function() {
        inp.value = c.nom;
        sugg.style.display = 'none';
        if (window._communeMarker) map.removeLayer(window._communeMarker);
        // Fetch coords officielles IGN puis afficher
        fetch('https://geo.api.gouv.fr/communes/' + c.insee + '?fields=centre&format=json')
          .then(function(r){ return r.json(); })
          .then(function(data){
            var lat = c.lat, lon = c.lon;
            if (data && data.centre && data.centre.coordinates) {
              lon = data.centre.coordinates[0];
              lat = data.centre.coordinates[1];
            }
            _harponCommuneAfficher(c, lat, lon);
          })
          .catch(function(){ _harponCommuneAfficher(c, c.lat, c.lon); });
      });
      sugg.appendChild(div);
    });
    sugg.style.display = 'block';
  });
  document.addEventListener('click', function(e) {
    if (!inp.contains(e.target) && !sugg.contains(e.target)) sugg.style.display='none';
  });
}

function _harponCommuneAfficher(c, lat, lon) {
  map.setView([lat, lon], 13);
  if (window._communeMarker) map.removeLayer(window._communeMarker);
  var dfciCode = '';
  if (typeof DFCI_2KM !== 'undefined') {
    var best = null, bestDist = 999;
    DFCI_2KM.features.forEach(function(f) {
      var dx = f.properties.cx - lon, dy = f.properties.cy - lat;
      var d = dx*dx + dy*dy;
      if (d < bestDist) { bestDist = d; best = f; }
    });
    if (best) dfciCode = best.properties.c;
  }
  var hasDfci = dfciCode && dfciCode !== '';
  var dfciBlock = hasDfci
    ? '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #2a3040;">'
    + '<div style="font-size:11px;color:#6a7a8a;margin-bottom:4px;">Code DFCI</div>'
    + '<div style="display:flex;align-items:center;gap:8px;justify-content:center;">'
    + '<span class="sdp-dfci-code" data-code="' + dfciCode + '" '
    + 'title="Clic droit pour envoyer dans un slot libre" '
    + 'style="font-size:15px;font-weight:700;color:#e8a020;cursor:context-menu;'
    + 'font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">' + dfciCode + '</span>'
    + '<button class="sdp-send-dfci" data-code="' + dfciCode + '" '
    + 'title="Envoyer dans le premier slot libre S1-S4" '
    + 'style="background:#1a2535;border:1px solid #4a7ab0;border-radius:4px;'
    + 'color:#7ab3f0;font-family:Barlow Condensed,sans-serif;font-size:11px;'
    + 'padding:2px 8px;cursor:pointer;white-space:nowrap;">→ Slot libre</button>'
    + '</div>'
    + '<div style="font-size:10px;color:#4a5a6a;margin-top:3px;">Clic bouton ou clic droit sur le code</div>'
    + '</div>'
    : '';
  var popupHtml = '<div class="popup-inner" style="min-width:220px;">'
    + '<b style="color:#e8a020;font-family:Barlow Condensed,sans-serif;font-size:15px;">' + c.nom + '</b>'
    + '<div style="font-size:11px;color:#8a9bb0;margin-top:2px;">INSEE ' + c.insee + '</div>'
    + dfciBlock
    + '</div>';
  window._communeMarker = L.circleMarker([lat, lon], {
    radius:8, color:'#e85d26', fillColor:'#e85d26', fillOpacity:0.8, weight:2
  }).bindPopup(popupHtml, {className:'custom-popup', maxWidth:240})
    .addTo(map).openPopup();
}

function genererRapport() {
  var now = new Date();
  var txt = 'RAPPORT HARPON83 — ' + now.toLocaleString('fr-FR') + '\n';
  txt += '═══════════════════════════════\n';
  var ch = document.getElementById('bandeau-chantier').textContent;
  txt += 'CHANTIER : ' + ch + '\n';
  txt += '───────────────────────────────\n';
  var total = 0;
  Object.keys(marqueursSlot).forEach(function(s) {
    var sl = marqueursSlot[s];
    Object.keys(sl).forEach(function(type) {
      var pts = sl[type];
      if (pts.length > 0) {
        pts.forEach(function(mkr) {
          var ll = mkr.getLatLng();
          txt += type.toUpperCase().padEnd(12) +
            ' Lat:' + ll.lat.toFixed(4) + ' Lon:' + ll.lng.toFixed(4) + '\n';
          total++;
        });
      }
    });
  });
  txt += '───────────────────────────────\n';
  txt += 'TOTAL POINTS : ' + total + '\n';
  txt += 'GPS : ' + (gpsActif ? 'ACTIF' : 'INACTIF') + '\n';
  document.getElementById('rapport-txt').value = txt;
}

function copierRapport() {
  var txt = document.getElementById('rapport-txt').value;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function() {
      document.getElementById('btn-rapport').textContent = '✓ Copié';
      setTimeout(function() { document.getElementById('btn-rapport').textContent = '📋 Rapport'; }, 1500);
    });
  }
}

function chargerPoints(ptsParam) {
  // Format: transit:43.41:6.02,feu:43.39:5.99
  if (!ptsParam) return;
  ptsParam.split(',').forEach(function(pt) {
    var parts = pt.split(':');
    if (parts.length >= 3) {
      var type = parts[0], lat = parseFloat(parts[1]), lon = parseFloat(parts[2]);
      if (!isNaN(lat) && !isNaN(lon) && TACTIQUE_DEF[type]) {
        deposerMarqueur(type, lat, lon, '—', null);
      }
    }
  });
}

// ── Recherche adresse / lieu-dit ──────────────────────────────────────────────
function sdpSearchAddr() {
  var val = document.getElementById('sdp-addr-input').value.trim();
  if (!val) return;
  var results = document.getElementById('sdp-results');
  results.innerHTML = '<div class="sdp-loading"><span class="dfci-spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>Recherche...</div>';

  // Auto-sélection : si le champ commune a du texte mais sdpCommuneSelect est null
  // → chercher une correspondance exacte dans COMMUNES_VAR
  if (!sdpCommuneSelect) {
    var cinp = document.getElementById('sdp-commune-input');
    if (cinp && cinp.value.trim().length > 1) {
      var val2 = cinp.value.trim().toLowerCase();
      var found = COMMUNES_VAR.find(function(cm) {
        return cm.nom.toLowerCase() === val2;
      });
      if (!found) found = COMMUNES_VAR.find(function(cm) {
        return cm.nom.toLowerCase().indexOf(val2) === 0;
      });
      if (found) {
        sdpSelectCommune(found);
        // sdpCommuneSelect est maintenant défini
      }
    }
  }

  var VAR_BBOX = {minLon:5.67, minLat:42.98, maxLon:7.72, maxLat:43.93};
  var commune  = sdpCommuneSelect ? sdpCommuneSelect.nom : '';
  var clat     = sdpCommuneSelect ? sdpCommuneSelect.lat : 43.4;
  var clon     = sdpCommuneSelect ? sdpCommuneSelect.lon : 6.2;

  // Avec commune : bbox ±6km (0.06° lat/lon ≈ 5-6km dans le Var)
  var dd = 0.06;
  var bboxMinLon = sdpCommuneSelect ? Math.max(clon-dd, VAR_BBOX.minLon) : VAR_BBOX.minLon;
  var bboxMinLat = sdpCommuneSelect ? Math.max(clat-dd, VAR_BBOX.minLat) : VAR_BBOX.minLat;
  var bboxMaxLon = sdpCommuneSelect ? Math.min(clon+dd, VAR_BBOX.maxLon) : VAR_BBOX.maxLon;
  var bboxMaxLat = sdpCommuneSelect ? Math.min(clat+dd, VAR_BBOX.maxLat) : VAR_BBOX.maxLat;

  // ── Source 1 : BAN ── citycode strict si commune connue ──────────────────
  var banUrl;
  if (sdpCommuneSelect && sdpCommuneSelect.insee) {
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val) + '&limit=8&autocomplete=0'
      + '&citycode=' + sdpCommuneSelect.insee;
  } else if (sdpCommuneSelect) {
    // INSEE pas encore chargé — filtre lat/lon serré
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val) + '&limit=8&autocomplete=0'
      + '&lat=' + clat + '&lon=' + clon;
  } else {
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val + ' 83') + '&limit=5&autocomplete=0'
      + '&lat=43.4&lon=6.2';
  }

  // ── Source 2 : IGN — toponymies SCAN25, bbox stricte ─────────────────────
  // Requête sans le nom commune pour éviter la dérive géographique
  var ignUrl = 'https://data.geopf.fr/geocodage/search?q='
    + encodeURIComponent(val)
    + '&index=PositionOfInterest&limit=8'
    + '&bbox=' + bboxMinLon + ',' + bboxMinLat + ',' + bboxMaxLon + ',' + bboxMaxLat;

  // ── Source 3 : Nominatim — bounded strict ────────────────────────────────
  var nomViewbox = sdpCommuneSelect
    ? (bboxMinLon+','+bboxMaxLat+','+bboxMaxLon+','+bboxMinLat)
    : (VAR_BBOX.minLon+','+VAR_BBOX.maxLat+','+VAR_BBOX.maxLon+','+VAR_BBOX.minLat);
  var nomQuery = sdpCommuneSelect
    ? val + ' ' + commune         // avec commune → plus précis
    : val + ' Var';
  var nomUrl = 'https://nominatim.openstreetmap.org/search?format=json&limit=4'
    + '&q=' + encodeURIComponent(nomQuery)
    + '&viewbox=' + nomViewbox + '&bounded=1&accept-language=fr';

  var done = 0;
  var banR = [], ignR = [], nomR = [];

  function merge() {
    done++;
    if (done < 3) return;
    var all = [];
    var SC = {BAN:'#4caf50', IGN:'#e8a020', OSM:'#7ab3f0'};
    var ST = {BAN:'Adresse officielle', IGN:'Toponymie IGN/SCAN25', OSM:'OpenStreetMap'};

    banR.forEach(function(f) {
      if (!f.geometry) return;
      var tl = {housenumber:'Adresse',street:'Rue',locality:'Lieu-dit',
                municipality:'Commune'}[f.properties.type] || f.properties.type;
      all.push({
        name: f.properties.label,
        sub:  f.properties.city && f.properties.city !== f.properties.label
              ? f.properties.city : (f.properties.context || ''),
        type: tl, lat: f.geometry.coordinates[1],
        lon:  f.geometry.coordinates[0], src: 'BAN'
      });
    });

    ignR.forEach(function(f) {
      if (!f.geometry) return;
      var lt = f.geometry.coordinates[1], ln = f.geometry.coordinates[0];
      // Filtrage strict bbox
      if (lt < bboxMinLat || lt > bboxMaxLat || ln < bboxMinLon || ln > bboxMaxLon) return;
      if (all.some(function(a){return Math.abs(a.lat-lt)<0.001 && Math.abs(a.lon-ln)<0.001;})) return;
      var p = f.properties;
      all.push({
        name: p.label || p.name || p.toponym || '',
        sub:  p.city || p.municipality || '',
        type: p.type || 'Lieu IGN',
        lat:  lt, lon: ln, src: 'IGN'
      });
    });

    nomR.forEach(function(r) {
      var lt = parseFloat(r.lat), ln = parseFloat(r.lon);
      // Filtrage strict bbox : rejeter tout résultat hors de la zone cible
      if (lt < bboxMinLat || lt > bboxMaxLat || ln < bboxMinLon || ln > bboxMaxLon) return;
      if (all.some(function(a){return Math.abs(a.lat-lt)<0.002 && Math.abs(a.lon-ln)<0.002;})) return;
      var pts = r.display_name.split(',');
      all.push({
        name: pts[0].trim(), sub: pts.slice(1,3).join(',').trim(),
        type: r.type || 'lieu', lat: lt, lon: ln, src: 'OSM'
      });
    });

    if (!all.length) {
      results.innerHTML = '<div class="sdp-empty">Aucun resultat</div>';
      return;
    }
    results.innerHTML = '';
    all.slice(0, 12).forEach(function(item) {
      var dfciCode = '';
      if (typeof DFCI_2KM !== 'undefined') {
        var best = null, bd = 999;
        DFCI_2KM.features.forEach(function(f) {
          var d = (f.properties.cx-item.lon)*(f.properties.cx-item.lon)
                + (f.properties.cy-item.lat)*(f.properties.cy-item.lat);
          if (d < bd) { bd = d; best = f; }
        });
        if (best) dfciCode = best.properties.c;
      }
      var col = SC[item.src] || '#8a9bb0';
      var div = document.createElement('div');
      div.className = 'sdp-result-item';
      div.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        + '<div class="sdp-result-name">' + item.name + '</div>'
        + '<span style="font-size:10px;color:'+col+';background:'+col+'22;'
        + 'border-radius:3px;padding:1px 5px;flex-shrink:0;margin-left:6px;'
        + 'font-family:Barlow Condensed,sans-serif;" title="'+(ST[item.src]||item.src)+'">'
        + item.src + '</span></div>'
        + (item.sub ? '<div class="sdp-result-sub">'+item.sub+'</div>' : '')
        + (dfciCode ? '<div class="sdp-result-dfci">&#128208; '+dfciCode+'</div>' : '');
      div.addEventListener('click', function() { sdpGoToResult(item, dfciCode); });
      results.appendChild(div);
    });
  }

  fetch(banUrl)
    .then(function(r){return r.json();})
    .then(function(d){banR=d.features||[];merge();})
    .catch(function(){merge();});
  fetch(ignUrl)
    .then(function(r){return r.json();})
    .then(function(d){ignR=d.features||[];merge();})
    .catch(function(){merge();});
  fetch(nomUrl, {headers:{'User-Agent':'HARPON83-CCFF-Var/1.0'}})
    .then(function(r){return r.json();})
    .then(function(d){nomR=d||[];merge();})
    .catch(function(){merge();});
}
function sdpClearAddr() {
  document.getElementById('sdp-addr-input').value = '';
  document.getElementById('sdp-results').innerHTML = '';
  // Retirer marqueurs de recherche
  sdpMarkers.forEach(function(m) { map.removeLayer(m); });
  sdpMarkers = [];

function sdpGoToResult(item, dfciCode) {
  if (window._sdpLastMarker) map.removeLayer(window._sdpLastMarker);
  map.setView([item.lat, item.lon], 16);

  var dfciBlock = '';
  if (dfciCode) {
    dfciBlock = '<div style="margin-top:6px;padding-top:6px;border-top:1px solid #2a3040;">'
      + '<div style="font-size:11px;color:#6a7a8a;margin-bottom:3px;">Code DFCI</div>'
      + '<div style="display:flex;align-items:center;gap:8px;">'
      + '<span class="sdp-dfci-code" data-code="' + dfciCode + '" '
      + 'title="Clic droit pour envoyer dans un slot libre (S1-S4)" '
      + 'style="font-size:15px;font-weight:700;color:#e8a020;cursor:context-menu;'
      + 'font-family:Barlow Condensed,sans-serif;letter-spacing:1px;">' + dfciCode + '</span>'
      + '<button class="sdp-send-dfci" data-code="' + dfciCode + '" '
      + 'title="Envoyer dans le premier slot libre S1 a S4" '
      + 'style="background:#1a2535;border:1px solid #4a7ab0;border-radius:4px;'
      + 'color:#7ab3f0;font-family:Barlow Condensed,sans-serif;font-size:11px;'
      + 'padding:2px 8px;cursor:pointer;white-space:nowrap;">'
      + '\u2192 Slot libre</button>'
      + '</div>'
      + '<div style="font-size:10px;color:#4a5a6a;margin-top:3px;">'
      + 'Clic bouton ou clic droit sur le code</div>'
      + '</div>';
  }

  var popupHtml = '<div class="popup-inner" style="min-width:220px;">'
    + '<b style="color:#e8a020;font-family:Barlow Condensed,sans-serif;font-size:15px;">' + item.name + '</b>';
  if (item.sub) popupHtml += '<div style="font-size:11px;color:#6a7a8a;margin-top:2px;">' + item.sub + '</div>';
  popupHtml += dfciBlock + '</div>';

  window._sdpLastMarker = L.circleMarker([item.lat, item.lon], {
    radius: 9, color: '#e85d26', fillColor: '#ff8c00', fillOpacity: 0.9, weight: 2
  }).bindPopup(popupHtml, {className: 'custom-popup', maxWidth: 260})
    .addTo(map)
    .openPopup();

  sdpMarkers.push(window._sdpLastMarker);
}

// Envoyer un code DFCI dans le premier slot libre S1-S4
function sdpEnvoyerDFCI(code) {
  var slots = [1, 2, 3, 4];
  var target = null;
  for (var i = 0; i < slots.length; i++) {
    var n = slots[i];
    var inp = document.getElementById('dfci-input-' + n);
    if (inp && (!inp.value.trim() || !dfciState[n].highlight)) {
      target = n;
      break;
    }
  }
  if (target === null) target = 1; // tous occupés → S1
  var inp = document.getElementById('dfci-input-' + target);
  if (inp) {
    inp.value = code;
    dfciSearch(target);
    map.closePopup();
    // Flash visuel sur le label du slot
    var label = document.querySelector('.dfci-search-label.s' + target);
    if (label) {
      var orig = label.style.background;
      var origC = label.style.color;
      label.style.background = '#e85d26';
      label.style.color = '#fff';
      setTimeout(function() { label.style.background = orig; label.style.color = origC; }, 900);
    }
  }
}

</script>
