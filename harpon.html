<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>HARPON83 — Cartographie terrain</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js">
</script>
<script src="dfci_official.js?v=20260604"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d1117;color:#e0e8f0;font-family:'Barlow',sans-serif}

/* ── PIN ── */
#pin-overlay{display:flex;position:fixed;inset:0;background:#0d1117;z-index:99999;align-items:center;justify-content:center}
#pin-overlay.hidden{display:none}
#pin-box{background:#13181f;border:1px solid #e85d26;border-radius:12px;padding:36px 40px;text-align:center;min-width:300px;box-shadow:0 8px 40px rgba(232,93,38,0.3)}
#pin-box .logo{margin-bottom:16px;display:flex;justify-content:center}
#pin-box .logo img{height:72px;width:auto;object-fit:contain}
#pin-box h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#e85d26;margin-bottom:2px;letter-spacing:1px}
#pin-box .sub{font-size:11px;color:#6a7a8a;margin-bottom:6px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px}
#pin-box .badge{display:inline-block;background:#1a3a6b;color:#7ab3f0;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;margin-bottom:20px;letter-spacing:1px}
#pin-input{width:160px;background:#2a3245;border:2px solid #4a5570;border-radius:6px;color:#fff;font-size:28px;font-family:'Barlow Condensed',sans-serif;letter-spacing:10px;text-align:center;padding:10px 14px;outline:none;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto;transition:border-color 0.2s}
#pin-input:focus{border-color:#e85d26}
#pin-error{font-size:12px;color:#ef5350;min-height:18px;margin-bottom:12px;font-family:'Barlow Condensed',sans-serif}
#pin-btn{background:#e85d26;border:none;border-radius:6px;color:white;padding:10px 32px;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:background 0.15s,opacity 0.3s}
#pin-btn:hover{background:#c94e1e}
#pin-btn:disabled{background:#3a3a3a;cursor:not-allowed;opacity:0.6}
#dfci-loading{margin-top:14px;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#6a7a8a;display:flex;align-items:center;justify-content:center;gap:8px}
.dfci-spinner{width:14px;height:14px;border:2px solid #4a5570;border-top-color:#e85d26;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── BANDEAU CHANTIER ── */
#bandeau{background:#0a1020;border-bottom:2px solid #e85d26;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:52px}
#bandeau .logo-h{height:34px;width:auto}
#bandeau-titre{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#e85d26;letter-spacing:1px;flex:1}
#bandeau-statut{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:#8a9bb0;display:flex;align-items:center;gap:6px}
#statut-dot{width:8px;height:8px;border-radius:50%;background:#4caf50}
#bandeau-chantier{font-family:'Barlow Condensed',sans-serif;font-size:13px;background:#1a2535;border:1px solid #2a3a55;border-radius:6px;padding:4px 10px;color:#7ab3f0}
#btn-gps{background:#1a2535;border:1px solid #2a3a55;border-radius:6px;color:#7ab3f0;padding:4px 10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;cursor:pointer}
#btn-gps.actif{background:#1a3a6b;border-color:#4a7ab0;color:#a0c8f0}

/* ── BARRE RECHERCHE ── */
#barre{background:#13181f;border-bottom:1px solid #2a3040;padding:6px 10px;display:flex;align-items:center;gap:8px}
#dfci-input-1{flex:1;background:#2a3245;border:1.5px solid #ff3333;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:14px;padding:6px 10px;outline:none;text-transform:uppercase}
#dfci-input-1::placeholder{color:#4a5570;text-transform:none}
#dfci-input-1:focus{border-color:#ff6666}
#dfci-sugg-1{position:absolute;top:100%;left:0;right:0;background:#1a2030;border:1px solid #2a3040;border-radius:0 0 6px 6px;z-index:1000;max-height:180px;overflow-y:auto}
.dfci-sugg-item{padding:6px 10px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#c0d0e0;cursor:pointer;border-bottom:1px solid #1a2535}
.dfci-sugg-item:hover{background:#2a3245}
#dfci-sugg-container{position:relative;flex:1;display:flex;flex-direction:column}
#commune-input{flex:1;background:#2a3245;border:1.5px solid #4a5570;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:6px 10px;outline:none;max-width:180px}
#commune-input::placeholder{color:#4a5570}
#commune-sugg{position:absolute;top:100%;left:0;right:0;background:#1a2030;border:1px solid #2a3040;border-radius:0 0 6px 6px;z-index:1000;max-height:160px;overflow-y:auto}
#commune-sugg-container{position:relative;display:flex;flex-direction:column}
#btn-go{background:#e85d26;border:none;border-radius:6px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;padding:6px 14px;cursor:pointer}
#btn-clear{background:#2a3245;border:1px solid #4a5570;border-radius:6px;color:#8a9bb0;padding:6px 8px;cursor:pointer;font-size:13px}

/* ── CARTE ── */
#map{position:absolute;top:0;left:0;right:0;bottom:0}
#map-wrap{flex:1;position:relative;overflow:hidden}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh}

/* ── BARRE BASSE (OUTILS) ── */
#toolbar{background:#0a1020;border-top:1px solid #2a3040;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:500}
.tool-btn{background:#1a2535;border:1px solid #2a3a55;border-radius:8px;color:#7ab3f0;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;transition:background 0.15s,border-color 0.15s}
.tool-btn.actif{background:#1a3a6b;border-color:#4a7ab0;color:#a0c8f0}
.tool-btn:hover{background:#243050}
#rapport-zone{display:none;position:fixed;bottom:70px;left:10px;right:10px;background:#13181f;border:1px solid #2a3040;border-radius:8px;padding:12px;z-index:600;max-height:40vh;overflow-y:auto}
#rapport-zone textarea{width:100%;background:#0a1020;border:1px solid #2a3040;border-radius:6px;color:#c0d0e0;font-family:monospace;font-size:12px;padding:8px;resize:vertical;min-height:120px}

/* ── FONDS DE CARTE SELECTOR ── */
#fond-selector{position:absolute;top:8px;right:8px;z-index:400;display:flex;flex-direction:column;gap:4px}
.fond-btn{background:#13181f;border:1px solid #2a3040;border-radius:6px;color:#8a9bb0;padding:5px 10px;font-family:'Barlow Condensed',sans-serif;font-size:12px;cursor:pointer;text-align:left;transition:all 0.15s}
.fond-btn.actif{background:#1a3a6b;border-color:#4a7ab0;color:#a0c8f0}
.fond-btn:hover{background:#1a2535}

/* ── CSS réutilisé ── */
.custom-popup .leaflet-popup-content-wrapper {
    background: #13181f;
    border: 1px solid #2a3040;
    border-radius: 8px;
    color: #e0e0e0;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    padding: 0;
  }
.dfci-label-2km {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-family: 'Barlow Condensed', monospace, sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 2px #000, 0 0 4px #000, 1px 1px 3px #000, -1px -1px 3px #000;
    letter-spacing: 0.5px;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
  }
.dfci-tooltip-10km {
    background: rgba(13,17,23,0.85) !important;
    border: 1px solid #fff !important;
    color: #fff !important;
    font-family: 'Barlow Condensed', sans-serif !important;
    font-size: 15px !important;
    font-weight: 700 !important;
    padding: 4px 10px !important;
    border-radius: 4px !important;
    letter-spacing: 1px !important;
  }
.tactique-btns {
    display: flex;
    gap: 6px;
    justify-content: center;
    padding: 8px 4px 4px;
    border-top: 1px solid #2a3040;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  .tactique-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: #1a1f2e;
    border: 1px solid #2a3040;
    border-radius: 6px;
    padding: 5px 8px;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    color: #8a9bb0;
    transition: all 0.15s;
    min-width: 44px;
  }
  .tactique-btn:hover { background: #1e2733; color: #fff; border-color: #4a5570; }
  .tactique-btn .tb-icon { font-size: 16px; line-height: 1; }
  .tactique-btn .tb-label { letter-spacing: 0.3px; }


  /* ── F1 : Contour commune ── */
  .commune-label {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: #ffd166;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 0 8px rgba(0,0,0,0.7);
    letter-spacing: 0.5px;
    pointer-events: none;
    white-space: nowrap;
    text-align: center;
    text-transform: uppercase;
  }
.tb-icon{font-size:18px;display:block;margin-bottom:2px}
.tb-label{font-size:10px;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px}

  .dfci-suggestion {
    padding:6px 10px; cursor:pointer;
    font-family:'Barlow Condensed',sans-serif; font-size:13px; color:#e0e0e0;
    border-bottom:1px solid #1e2733;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .dfci-suggestion:hover { background:#1a2535; }
  .dfci-suggestion:last-child { border-bottom:none; }
  .dfci-sug-code { color:#e8a020; font-weight:700; letter-spacing:0.5px; flex-shrink:0; }
  .dfci-sug-type { font-size:10px; color:#6a7a8a; flex-shrink:0; }

  /* ── PANNEAU RECHERCHE DÉTAILLÉE ── */
  #btn-search-detail {
    background: #1a2535;
    border: 1px solid #e85d26;
    border-radius: 8px;
    color: #e85d26;
    padding: 7px 12px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #btn-search-detail.actif { background:#2a1500; border-color:#e85d26; }
  #btn-search-detail:hover { background:#2a1800; }

  #search-detail-panel {
    display: none;
    position: fixed;
    top: 100px;
    left: 10px;
    width: 320px;
    background: #13181f;
    border: 1px solid #2a3a55;
    border-radius: 10px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    z-index: 700;
    overflow: hidden;
  }
  #search-detail-panel.visible { display: block; }

  #sdp-header {
    background: #0a1020;
    border-bottom: 1px solid #2a3a55;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #sdp-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #e85d26;
    letter-spacing: 1px;
  }
  #sdp-close {
    background: none;
    border: none;
    color: #6a7a8a;
    cursor: pointer;
    font-size: 16px;
    padding: 0 4px;
    line-height: 1;
  }
  #sdp-close:hover { color: #e85d26; }

  #sdp-body { padding: 10px 12px; }

  .sdp-section {
    margin-bottom: 10px;
  }
  .sdp-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #4a6a8a;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sdp-input-row {
    display: flex;
    gap: 6px;
    align-items: center;
    position: relative;
  }
  .sdp-input {
    flex: 1;
    background: #2a3245;
    border: 1.5px solid #4a5570;
    border-radius: 6px;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .sdp-input:focus { border-color: #e85d26; }
  .sdp-input::placeholder { color: #4a5570; }
  .sdp-btn-go {
    background: #e85d26;
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .sdp-btn-go:hover { background: #c94e1e; }
  .sdp-btn-clear {
    background: none;
    border: none;
    color: #6a7a8a;
    cursor: pointer;
    font-size: 13px;
    flex-shrink: 0;
    padding: 0 4px;
  }
  .sdp-btn-clear:hover { color: #ef5350; }

  .sdp-sugg {
    position: absolute;
    top: 100%;
    left: 0;
    right: 34px;
    background: #1a2030;
    border: 1px solid #2a3040;
    border-radius: 0 0 6px 6px;
    z-index: 800;
    max-height: 150px;
    overflow-y: auto;
    display: none;
  }

  #sdp-results {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 6px;
  }
  #sdp-results::-webkit-scrollbar { width: 4px; }
  #sdp-results::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 2px; }

  .sdp-result-item {
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid #1a2535;
    border-radius: 4px;
    transition: background 0.1s;
  }
  .sdp-result-item:hover { background: #1a2535; }
  .sdp-result-item:last-child { border-bottom: none; }
  .sdp-result-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: #e0e8f0;
    font-weight: 600;
  }
  .sdp-result-sub {
    font-size: 11px;
    color: #6a7a8a;
    margin-top: 1px;
  }
  .sdp-result-dfci {
    font-size: 11px;
    color: #7ab3f0;
    font-family: 'Barlow Condensed', sans-serif;
    margin-top: 1px;
  }
  .sdp-loading {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: #6a7a8a;
    font-family: 'Barlow Condensed', sans-serif;
  }
  .sdp-empty {
    text-align: center;
    padding: 12px;
    font-size: 12px;
    color: #4a5570;
    font-family: 'Barlow Condensed', sans-serif;
  }
  #sdp-commune-context {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    color: #4caf50;
    padding: 4px 0 6px;
    display: none;
  }

</style>
</head>

<script>
// ── PIN ───────────────────────────────────────────────────────────────────────
var PIN_HARPON = '1234'; // À changer — PIN spécifique HARPON

document.getElementById('pin-input').addEventListener('input', function() {
  document.getElementById('pin-btn').disabled = this.value.length < 4;
});

function pinValider() {
  var v = document.getElementById('pin-input').value;
  if (v === PIN_HARPON) {
    document.getElementById('pin-overlay').classList.add('hidden');
    initApp();
  } else {
    document.getElementById('pin-error').textContent = 'Code incorrect';
    document.getElementById('pin-input').value = '';
    document.getElementById('pin-btn').disabled = true;
  }
}

// Débloquer quand DFCI chargé
function checkDFCIReady() {
  if (typeof DFCI_2KM !== 'undefined' && DFCI_2KM.features && DFCI_2KM.features.length >= 3000) {
    document.getElementById('dfci-loading').innerHTML =
      '<span style="color:#4caf50">✓</span> Données DFCI prêtes (' + DFCI_2KM.features.length + ' carreaux)';
    document.getElementById('pin-btn').disabled = document.getElementById('pin-input').value.length < 4;
  } else {
    setTimeout(checkDFCIReady, 300);
  }
}
setTimeout(checkDFCIReady, 300);

// ── CARTE ────────────────────────────────────────────────────────────────────
var map, currentLayer, dfciIgnLayer, dfciIgnVisible = false;
var dfciVisible = false, dfciLayer20 = null, dfciLayer2 = null;
var vigiesLayer = null, vigiesVisible = false;
var visuVigies = null, visuVisible = false;
var markerGPS = null, gpsActif = false;

var layers = {
  osm:  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}),
  topo: L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'}),
  sat:  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'}),
  ign:  L.tileLayer('https://data.geopf.fr/private/wmts?apikey=ign_scan_ws' + '&LAYER=GEOGRAPHICALGRIDSYSTEMS.MAPS.SCAN25TOUR&EXCEPTIONS=text/xml' + '&FORMAT=image/jpeg&SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile' + '&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}', {maxNativeZoom:16, maxZoom:18, attribution:'© IGN Géoportail — SCAN25'})
};

function initApp() {
  map = L.map('map', { center:[43.38,6.22], zoom:11, zoomControl:true, attributionControl:false });
  currentLayer = layers['osm'].addTo(map);

  // Lecture paramètres URL (Option C)
  var params = new URLSearchParams(window.location.search);
  var dfciParam = params.get('dfci');
  var latParam  = params.get('lat');
  var lonParam  = params.get('lon');
  var zoomParam = params.get('zoom');
  var ptsParam  = params.get('pts');

  if (dfciParam) {
    document.getElementById('bandeau-chantier').textContent = dfciParam;
    document.getElementById('bandeau-chantier').style.color = '#ff3333';
    document.getElementById('statut-txt').textContent = 'Chantier reçu';
    document.getElementById('statut-dot').style.background = '#ff9800';
    document.getElementById('dfci-input-1').value = dfciParam;
  }
  if (latParam && lonParam) {
    map.setView([parseFloat(latParam), parseFloat(lonParam)], parseInt(zoomParam)||13);
  }

  // Activer Insert Points automatiquement si chantier reçu
  if (dfciParam) {
    setTimeout(function() {
      toggleInsertPoints();
      if (dfciParam) setTimeout(function() { dfciSearch(1); }, 500);
      // Charger points pré-déposés
      if (ptsParam) chargerPoints(ptsParam);
    }, 800);
  }

  // Vigies (données légères)
  initVigies();
  initCommuneSearch();
  initAutoComplete(1);
  initZoomend();
  initClickHandler();
}

function setFond(key, btn) {
  map.removeLayer(currentLayer);
  currentLayer = layers[key].addTo(map);
  document.querySelectorAll('.fond-btn').forEach(b => b.classList.remove('actif'));
  btn.classList.add('actif');
}

function toggleFondSelector() {
  var fs = document.getElementById('fond-selector');
  fs.style.display = fs.style.display === 'none' ? 'flex' : 'none';
}

// ── GPS POSITION ──────────────────────────────────────────────────────────────
function toggleGPS() {
  var btn = document.getElementById('btn-gps');
  if (gpsActif) {
    if (markerGPS) { map.removeLayer(markerGPS); markerGPS = null; }
    gpsActif = false;
    btn.classList.remove('actif');
    btn.textContent = '📍 Ma position';
  } else {
    if (!navigator.geolocation) { alert('Géolocalisation non disponible'); return; }
    btn.textContent = '⌛ Localisation…';
    navigator.geolocation.watchPosition(function(pos) {
      var lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (!markerGPS) {
        markerGPS = L.circleMarker([lat,lon], {
          radius:10, color:'#4caf50', fillColor:'#4caf50', fillOpacity:0.7, weight:2
        }).addTo(map).bindPopup('🚗 HARPON83 ici');
        map.setView([lat,lon], 13);
      } else {
        markerGPS.setLatLng([lat,lon]);
      }
      gpsActif = true;
      btn.classList.add('actif');
      btn.textContent = '📍 Position active';
    }, function() {
      btn.textContent = '📍 Ma position';
      alert("Impossible d'obtenir la position");
    }, { enableHighAccuracy:true, maximumAge:5000 });
  }
}

function communeFillOpacity(zoom) {
  if (zoom <= 9)  return 0.30;
  if (zoom <= 11) return 0.20;
  if (zoom <= 13) return 0.12;
  return 0.06;
}

var ZONE_LABELS = {
  '.1':'Haut Gauche', '.2':'Haut Droit',
  '.3':'Bas Droit',   '.4':'Bas Gauche', '.5':'Centre'
};

function dfciFindFeature2km(code2) {
  if (!DFCI_2KM) return null;
  for (var i=0; i<DFCI_2KM.features.length; i++)
    if (DFCI_2KM.features[i].properties.c === code2) return DFCI_2KM.features[i];
  return null;
}
function dfciFindFeature20km(code20) {
  if (!DFCI_20KM) return null;
  for (var i=0; i<DFCI_20KM.features.length; i++)
    if (DFCI_20KM.features[i].properties.c === code20) return DFCI_20KM.features[i];
  return null;
}
function dfciZoneCenter(feat, zone) {
  var coords = feat.geometry.coordinates[0];
  var lons = coords.slice(0,4).map(function(c){return c[0];});
  var lats = coords.slice(0,4).map(function(c){return c[1];});
  var minLon=Math.min.apply(null,lons), maxLon=Math.max.apply(null,lons);
  var minLat=Math.min.apply(null,lats), maxLat=Math.max.apply(null,lats);
  var midLon=(minLon+maxLon)/2, midLat=(minLat+maxLat)/2;
  var centers={
    '.1':[(midLat+maxLat)/2,(minLon+midLon)/2],
    '.2':[(midLat+maxLat)/2,(midLon+maxLon)/2],
    '.3':[(minLat+midLat)/2,(midLon+maxLon)/2],
    '.4':[(minLat+midLat)/2,(minLon+midLon)/2],
    '.5':[midLat,midLon]
  };
  return centers[zone] || [midLat,midLon];
}

function dfciParseCode(raw) {
  var s = raw.trim().toUpperCase();
  s = s.replace(/;/g, '.');
  s = s.replace(/,/g, '.');
  s = s.replace(/:/g, '.');
  s = s.replace(/\s+/g, '');
  s = s.replace(/[-/]([1-5])$/, '.$1');
  var mFix = s.match(/^([A-Z]{2}\d{2}[A-HKL]\d)([1-5])$/);
  if (mFix) s = mFix[1] + '.' + mFix[2];
  var m20 = s.match(/^([A-Z]{2}\d{2})$/);
  var m2  = s.match(/^([A-Z]{2}\d{2}[A-HKL]\d)$/);
  var m1  = s.match(/^([A-Z]{2}\d{2}[A-HKL]\d)\.([1-5])$/);
  if (m1)  return { type:'1km',  code2:m1[1], zone:'.'+m1[2], full:s };
  if (m2)  return { type:'2km',  code2:m2[1], full:s };
  if (m20) return { type:'20km', code20:m20[1], full:s };
  return null;
}
function fetchCommune(n, lat, lon) {
  // Effacer l'ancien contour commune de ce slot
  if (dfciState[n].commune)      { map.removeLayer(dfciState[n].commune);      dfciState[n].commune=null; }
  if (dfciState[n].communeLabel) { map.removeLayer(dfciState[n].communeLabel); dfciState[n].communeLabel=null; }

  var url = 'https://geo.api.gouv.fr/communes?lat=' + lat + '&lon=' + lon + '&fields=nom,contour&format=geojson&geometry=contour';

  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      if (!data.features || data.features.length === 0) return;
      var feat    = data.features[0];
      var nomComm = feat.properties.nom || '';
      var col     = COULEURS_COMMUNE[n];

      // ── Mettre à jour la commune dans le cadre incident ──
      // HARPON : pas de panel incidents — commune mise à jour dans le bandeau uniquement
      if (n === 1) {
        var bc = document.getElementById('bandeau-chantier');
        if (bc && bc.textContent.indexOf('Aucun') === -1) {
          // enrichir le bandeau avec la commune si chantier actif
        }
      }

      // Contour pointillé — fillOpacity adaptatif selon zoom (géré par zoomend)
      dfciState[n].commune = L.geoJSON(feat, {
        style: {
          color:       col,
          weight:      3,
          dashArray:   '8,6',
          fillColor:   col,
          fillOpacity: communeFillOpacity(map.getZoom()),
          opacity:     1,
          interactive: false
        }
      }).addTo(map);
      dfciState[n].communeColor = col;  // mémoriser pour zoom adaptatif

      // Passer au-dessus de tous les autres layers (tuiles, highlights, etc.)
      dfciState[n].commune.bringToFront();

      // Label centré sur la commune
      var bounds = dfciState[n].commune.getBounds();
      var ctr    = bounds.getCenter();
      dfciState[n].communeLabel = L.marker([ctr.lat, ctr.lng], {
        icon: L.divIcon({
          className: 'commune-label',
          html: nomComm,
          iconSize: null,
          iconAnchor: null
        }),
        interactive: false,
        keyboard:    false
      }).addTo(map);

      // Injecter le nom dans le popup DFCI — on interroge le marker stocké dans dfciState
      // Le popup est peut-être ouvert ou pas, on injecte dans le DOM s'il est présent
      var mkr = dfciState[n].marker;
      if (mkr) {
        var popup = mkr.getPopup();
        // Mettre à jour le contenu texte du popup avec la commune
        if (popup) {
          var currentContent = popup.getContent();
          // Vérifier qu'on n'a pas déjà injecté
          if (typeof currentContent === 'string' && currentContent.indexOf('commune-row') === -1) {
            var communeBlock = '<div class="commune-row" style="border-top:1px solid #2a3040;margin-top:8px;padding-top:8px;text-align:center;">'
              + '<span style="font-size:10px;color:#6a7a8a;letter-spacing:1px;text-transform:uppercase;">Commune</span>'
              + '<div style="font-size:15px;font-weight:700;color:' + col + ';letter-spacing:0.5px;margin-top:3px;">'
              + nomComm + '</div></div>';
            // Injecter avant la fermeture du div principal
            var newContent = currentContent.replace('</div>\n</div>', communeBlock + '</div>\n</div>');
            if (newContent === currentContent) {
              // fallback : ajouter à la fin du dernier div
              newContent = currentContent.slice(0, currentContent.lastIndexOf('</div>'))
                + communeBlock + '</div>';
            }
            popup.setContent(newContent);
            // Si le popup est ouvert, le DOM se rafraîchit automatiquement
          }
        }
      }
    })
    .catch(function(err) {
      console.warn('[F1] Commune fetch erreur:', err.message);
    });
}
function dfciSearch(n) {
  var raw    = document.getElementById('dfci-input-'+n).value;
  var parsed = dfciParseCode(raw);
  var col    = COULEURS[n];
  dfciClearSearch(n);
  document.getElementById('dfci-sugg-'+n).style.display = 'none';

  if (!parsed) return;

  if (parsed.type === '20km') {
    var f20 = dfciFindFeature20km(parsed.code20);
    if (!f20) return;
    map.setView([f20.properties.cy, f20.properties.cx], 11, {animate:true});
    dfciState[n].highlight = L.geoJSON(f20, {
      style:{color:col.fill, weight:3, fillColor:col.fill, fillOpacity:communeFillOpacity(map.getZoom())},
      onEachFeature: function(feature, layer) {
        layer.on('click', function(e) { map.fireEvent('click', e); });
      }
    }).addTo(map);
    // Ne pas interférer avec les couches d'affichage DFCI
    return;
  }

  var feat = dfciFindFeature2km(parsed.code2);
  if (!feat) return;

  dfciState[n].highlight = L.geoJSON(feat, {
    style:{color:col.fill, weight:2.5, fillColor:col.fill, fillOpacity:communeFillOpacity(map.getZoom())},
    onEachFeature: function(feature, layer) {
      layer.on('click', function(e) { map.fireEvent('click', e); });
    }
  }).addTo(map);

  var center, popupTxt, zoom;
  if (parsed.type === '2km') {
    center = [feat.properties.cy, feat.properties.cx];
    zoom   = 13;
    popupTxt = '<div style="text-align:center;padding:4px;">'

function initAutoComplete(n) {
  var inp  = document.getElementById('dfci-input-'+n);
  var sugg = document.getElementById('dfci-sugg-'+n);
  if (!inp) return;

  inp.addEventListener('keyup', function() {
    var pos   = inp.selectionStart;
    var fixed = inp.value.toUpperCase().replace(/;/g,'.').replace(/,/g,'.');
    if (fixed !== inp.value) {
      inp.value = fixed;
      try { inp.setSelectionRange(pos, pos); } catch(e) {}
    }
  });
  inp.addEventListener('blur', function() {
    // Au moment où l'opérateur quitte le champ : forcer majuscules + corrections
    inp.value = inp.value.toUpperCase().replace(/;/g,'.').replace(/,/g,'.');
  });

  inp.addEventListener('input', function() {
    var val = inp.value.trim().toUpperCase()
      .replace(/;/g,'.').replace(/,/g,'.').replace(/:/g,'.')
      .replace(/\s+/g,'');
    sugg.innerHTML = ''; sugg.style.display='none';
    if (val.length < 2) return;
    var matches = [];
    if (DFCI_20KM && val.length <= 4) {
      DFCI_20KM.features.forEach(function(f) {
        if (f.properties.c.startsWith(val)) matches.push({code:f.properties.c, type:'Maille 20km'});
      });
    }
    if (DFCI_2KM && val.length >= 4) {
      var base = val.replace(/\.\d$/,'');
      var count = 0;
      for (var i=0; i<DFCI_2KM.features.length && count<8; i++) {
        var c = DFCI_2KM.features[i].properties.c;
        if (c.startsWith(base)) {
          matches.push({code:c, type:'Carreau 2km'});
          if (val.length >= 6 && c === base) {
            ['.1','.2','.3','.4','.5'].forEach(function(z) {
              matches.push({code:c+z, type:'Zone 1km - '+ZONE_LABELS[z]});
            });
          }
          count++;
        }
      }
    }
    if (matches.length===0) return;
    sugg.style.display='block';
    matches.slice(0,10).forEach(function(m) {
      var div = document.createElement('div');
      div.className = 'dfci-suggestion';
      div.innerHTML = '<span class="dfci-sug-code">'+m.code+'</span>'
                    + '<span class="dfci-sug-type">'+m.type+'</span>';
      div.onclick = function() {
        inp.value = m.code;
        sugg.style.display='none';
        dfciSearch(n);
      };
      sugg.appendChild(div);
    });
  });

  inp.addEventListener('keydown', function(e) {
    if (e.key==='Enter')  { dfciSearch(n); sugg.style.display='none'; } // bloqué si IGN active
    if (e.key==='Escape') sugg.style.display='none';
  });
}
function buildDFCILayer20() {

    },

      var cx = feature.properties.cx;
      var cy = feature.properties.cy;
      var code = feature.properties.c;
      if (cx && cy) {
        // Labels masqués — affichés par la couche WMTS IGN

function buildDFCILayer2km() {
  var lg = L.layerGroup();
  if (typeof DFCI_2KM === 'undefined' || DFCI_2KM === null) return lg;
  var labelsLg = L.layerGroup();

    smoothFactor: 0,
    style: function() {
      return { color:'transparent', weight:0, fillOpacity:0.001, fillColor:'transparent', opacity:0 };
    },
    onEachFeature: function(feature, layer) {
      var code = feature.properties.c;
      var cx   = feature.properties.cx;
      var cy   = feature.properties.cy;
      if (cx && cy) {
        // Labels masqués — affichés par la couche WMTS IGN
        // On garde le marker invisible pour le clic uniquement
        void(cx); void(cy); void(code);
      }
      layer.on('click', function(e) {
            var clickLat = e.latlng.lat;
            var clickLon = e.latlng.lng;
            var bounds   = layer.getBounds();
            var minLat   = bounds.getSouth();
            var maxLat   = bounds.getNorth();
            var minLon   = bounds.getWest();
            var maxLon   = bounds.getEast();
            var midLat   = (minLat + maxLat) / 2;
            var midLon   = (minLon + maxLon) / 2;

            // Zone centrale = 33% autour du centre
            var marginLat = (maxLat - minLat) * 0.25;
            var marginLon = (maxLon - minLon) * 0.25;
            var isCenter  = (clickLat > midLat - marginLat && clickLat < midLat + marginLat &&
                             clickLon > midLon - marginLon && clickLon < midLon + marginLon);

            var zone, label, color;
            if (isCenter) {
              zone  = '.5';
              label = 'Centre';
              color = '#ffc832';
            } else if (clickLat >= midLat && clickLon <= midLon) {
              zone  = '.1';
              label = 'Haut Gauche';
              color = '#e8a020';
            } else if (clickLat >= midLat && clickLon > midLon) {
              zone  = '.2';
              label = 'Haut Droit';
              color = '#e8a020';
            } else if (clickLat < midLat && clickLon <= midLon) {
              zone  = '.4';
              label = 'Bas Gauche';
              color = '#e8a020';
            } else {
              zone  = '.3';
              label = 'Bas Droit';
              color = '#e8a020';
            }

            var zoneCode = code + zone;
            var clickLat2 = e.latlng.lat;
            var clickLon2 = e.latlng.lng;

            // Identifiant unique pour ce popup (pour màj async de la commune)
            var popupId = 'pp-' + Date.now();

            var buildHtml = function(nomCommune) {

                : '<div style="font-size:11px;color:#4a5a6a;margin-top:4px;margin-bottom:4px;" id="' + popupId + '-comm">Commune...</div>';
              return '<div style="text-align:center;padding:4px 0;">'
                + '<div style="font-size:22px;font-weight:700;color:' + color + ';letter-spacing:1px;margin-bottom:2px;">' + zoneCode + '</div>'
                + '<div style="font-size:12px;color:#8a9bb0;margin-bottom:4px;">' + label + ' - 1km x 1km</div>'
                + communeLigne
                + '<div style="font-size:10px;color:#4a5a6a;border-top:1px solid #2a3040;padding-top:4px;">' + code + ' (carreau 2km)</div>'
                + '</div>'
                + '<div class="tactique-btns" id="' + popupId + '-btns" data-lat="' + clickLat2 + '" data-lon="' + clickLon2 + '" data-dfci="' + zoneCode + '" data-commune="">'
                + '<button class="tactique-btn" data-type="transit" title="Point de Transit"><span class="tb-icon">\u{1F4CD}</span><span class="tb-label">Transit</span></button>'
                + '<button class="tactique-btn" data-type="engagement" title="Point d&#39;engagement"><span class="tb-icon">\u{1F3AF}</span><span class="tb-label">Engagement</span></button>'
                + '<button class="tactique-btn" data-type="codis" title="PC CODIS"><span class="tb-icon">\u{1F3C1}</span><span class="tb-label">PC CODIS</span></button>'
                + '<button class="tactique-btn" data-type="feu" title="D\u00e9part de Feu"><span class="tb-icon">\u{1F525}</span><span class="tb-label">D\u00e9part Feu</span></button>'
                + '<button class="tactique-btn" data-type="harpon" title="HARPON"><span class="tb-icon">\u{1F697}</span><span class="tb-label">HARPON</span></button>'
                + '<button class="tactique-btn" data-type="propagation" title="Propagation feu"><span class="tb-icon">&#x27A1;</span><span class="tb-label">Propagation</span></button>'
                + '</div>';
            };

            // Ouvrir le popup immédiatement (commune = "Commune...")
            var popup = L.popup({ className:'custom-popup', maxWidth:260 })
              .setLatLng(e.latlng)
              .setContent(buildHtml(''))
              .openOn(map);

            // Fetch commune exacte via API (asynchrone)
            fetch('https://geo.api.gouv.fr/communes?lat=' + clickLat2 + '&lon=' + clickLon2
                + '&fields=nom&format=json&limit=1')
              .then(function(r){ return r.json(); })
              .then(function(data) {
                if (!data || data.length === 0) return;
                var nomCommune = data[0].nom;
                // Mettre à jour le popup si encore ouvert
                var commEl = document.getElementById(popupId + '-comm');
                if (commEl) {
                  commEl.style.fontSize = '13px';
                  commEl.style.fontWeight = '700';
                  commEl.style.color = '#e8a020';
                  commEl.textContent = nomCommune;
                  commEl.id = ''; // éviter double màj
                }
                // Stocker dans data-commune pour deposerMarqueur
                var btnsEl = document.getElementById(popupId + '-btns');
                if (btnsEl) btnsEl.setAttribute('data-commune', nomCommune);
              })
              .catch(function(){});
          });
        }
      }).addTo(lg);
  lg.addLayer(labelsLg);
  return lg;
}

function toggleInsertPoints() {

          if (attr === 'data-commune') return mkr._tacticCommune || communeNom;
          return null;
        }

      // Supprimer l'ancien marqueur et relancer la rotation

      mkr._tacticLon = newLon;
    }
  });

  // Stocker les métadonnées pour dragend
  mkr._tacticDfci    = dfciCode;
  mkr._tacticCommune = communeNom;

  // Stocker la référence
  if (slot) {
    marqueursSlot[slot][type].push(mkr);
  } else {
    if (!marqueursSlot[0]) marqueursSlot[0] = { transit:[], engagement:[], codis:[], feu:[], harpon:[], propagation:[] };
    marqueursSlot[0][type].push(mkr);
  }
}

    if (!el) return null;
    var rect = el.getBoundingClientRect();
    return { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
  }

  function onMouseMove(e) {
    if (!_rotState) return;
    var center = getMarkerCenter();
    if (!center) return;
    var dx = e.clientX - center.x;
    var dy = e.clientY - center.y;
    var a = Math.atan2(dy, dx) * 180 / Math.PI + 90; // +90° : 0=haut
    _rotState.angle = a;
    mkr.setIcon(L.divIcon({
      html: makeRotIcon(a),
      className: '',
      iconSize: sz,
      iconAnchor: [sz[0]/2, sz[1]/2]
    }));
  }

  function onMouseUp() {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',  onMouseUp);
    map.dragging.enable();
    if (!_rotState) return;
    var finalAngle = _rotState.angle;
    map.removeLayer(mkr);
    _rotState = null;
    _finaliserRotation(type, lat, lon, dfci, container, slot, col, def, sz, finalAngle);
  }

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
}

function _finaliserRotation(type, lat, lon, dfci, container, slot, col, def, sz, angle) {
  var slotBadge = slot
    ? '<div style="position:absolute;top:-6px;right:-6px;width:14px;height:14px;'
      + 'border-radius:50%;background:' + col + ';border:1.5px solid #fff;'
      + 'font-size:8px;font-weight:700;display:flex;align-items:center;'
      + 'justify-content:center;color:#fff;font-family:Arial;">' + slot + '</div>'
    : '';
  var iconHtml = '<div style="position:relative;display:inline-block;'
    + 'transform:rotate(' + angle.toFixed(1) + 'deg);transform-origin:center center;">'
    + def.svg + slotBadge + '</div>';

  var heure      = new Date().toTimeString().slice(0,5);
  var slotTxt    = slot ? ' <span style="color:' + col + ';font-weight:700;">S' + slot + '</span>' : '';
  var communeNom = container ? (container.getAttribute('data-commune') || '') : '';
  var communeLigne = communeNom
    ? '<div class="popup-row"><span class="lbl">Commune</span>'
      + '<span class="val" style="color:#e8a020;">' + communeNom + '</span></div>' : '';

  var popupHtml = '<div class="popup-inner" style="min-width:200px;">'
    + '<div class="popup-header">'
    + '<div class="popup-icon" style="background:' + def.couleurBg + ';font-size:16px;">'
    + (type==='transit'?'\uD83D\uDCCD':'\uD83C\uDFAF') + '</div>'
    + '<div><div class="popup-title" style="color:' + def.couleur + ';">'
    + def.label + slotTxt + '</div>'
    + '<div class="popup-sub">' + dfci + ' &mdash; ' + heure
    + ' &mdash; ' + angle.toFixed(0) + '\u00b0</div></div>'
    + '</div>'
    + communeLigne
    + '<div class="popup-row"><span class="lbl">Lat / Lon</span>'
    + '<span class="val" style="font-size:11px;">' + lat.toFixed(5) + 'N  ' + lon.toFixed(5) + 'E</span></div>'
    + '<div style="display:flex;gap:6px;justify-content:center;margin-top:8px;'
    + 'padding-top:6px;border-top:1px solid #2a3040;">'
    + '<button onclick="supprimerMarqueur(this)" data-type="' + type + '" data-slot="' + slot + '" '
    + 'style="background:#3a0a0a;border:1px solid #ef5350;border-radius:4px;color:#ef5350;'
    + 'font-family:Arial,sans-serif;font-size:12px;padding:4px 10px;cursor:pointer;">'
    + '&#10005; Supprimer</button>'
    + '<button onclick="supprimerGroupe(this.dataset.type,+this.dataset.slot)" '
    + 'data-type="' + type + '" data-slot="' + slot + '" '
    + 'style="background:#1a1f2e;border:1px solid #4a5570;border-radius:4px;color:#8a9bb0;'
    + 'font-family:Arial,sans-serif;font-size:12px;padding:4px 10px;cursor:pointer;">'
    + '&#10005;&#10005; Effacer groupe</button>'
    + '</div></div>';

  var mkr = L.marker([lat, lon], {
    icon: L.divIcon({ html: iconHtml, className:'', iconSize: sz, iconAnchor: [sz[0]/2, sz[1]/2] }),
    zIndexOffset: 800,
    draggable: true
  }).bindPopup(popupHtml, { className:'custom-popup', maxWidth:240 }).addTo(map);

  var mkrId = Date.now() + Math.random();
  mkr._tactiqueId   = mkrId;
  mkr._tactiqueType = type;
  mkr._tactiqueSlot = slot;
  mkr._tacticDfci   = dfci;
  mkr._tacticAngle  = angle;

  var popupFinal = popupHtml.replace(
    'onclick="supprimerMarqueur(this)"',
    'onclick="supprimerMarqueur(this)" data-mkrid="' + mkrId + '"'
  );
  mkr.setPopupContent(popupFinal);

  // ── Drag → re-rotation automatique ──────────────────────────────────────
  mkr.on('dragstart', function() { mkr.closePopup(); });

  mkr.on('dragend', function(e) {
    var newLatLng = e.target.getLatLng();
    var newLat = newLatLng.lat;
    var newLon = newLatLng.lng;
    // Supprimer ce marqueur du slot
    var s = mkr._tactiqueSlot;
    var t = mkr._tactiqueType;
    if (marqueursSlot[s] && marqueursSlot[s][t]) {
      marqueursSlot[s][t] = marqueursSlot[s][t].filter(function(m) {
        return m._tactiqueId !== mkr._tactiqueId;
      });
    }
    map.removeLayer(mkr);
    slotActif = s;
    var fakeContainer = {
      getAttribute: function(attr) {
        if (attr === 'data-commune') return mkr._tacticCommune || '';
        return null;
      }
    };
    if (t === 'engagement') {
      initRotationMode(t, newLat, newLon, mkr._tacticDfci || dfci, fakeContainer, null);
    } else {
      deposerMarqueur(t, newLat, newLon, mkr._tacticDfci || dfci, fakeContainer);
    }
  });

  if (slot) {
    if (!marqueursSlot[slot][type]) marqueursSlot[slot][type] = [];
    marqueursSlot[slot][type].push(mkr);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// MODE PROPAGATION — Flèche rouge directionnelle
// Mousedown → origine fixe → drag pour direction+longueur → mouseup → fixe
// ══════════════════════════════════════════════════════════════════════════════
var _propLayer = null;  // polyline temporaire pendant le drag

function initPropagationMode(lat, lon, dfci, container, btn) {
  map.closePopup();
  map.dragging.disable();

  var slot = slotActif || 0;
  var col  = slot && COULEURS[slot] ? COULEURS[slot].fill : '#ffffff';

  // Vérifier quota
  if (!marqueursSlot[slot].propagation) marqueursSlot[slot].propagation = [];
  if (slot && marqueursSlot[slot].propagation.length >= MAX_MARQUEURS) {
    var oldest = marqueursSlot[slot].propagation.shift();
    if (oldest) map.removeLayer(oldest);
  }

  // Point d'origine en coordonnées carte
  var originPx = map.latLngToContainerPoint([lat, lon]);

  // Marqueur d'origine (petit point rouge)
  var originDot = L.circleMarker([lat, lon], {
    radius:6, color:'#cc0000', fillColor:'#ff2222', fillOpacity:1, weight:2,
    interactive:false
  }).addTo(map);

  // Flèche temporaire (sera recréée à chaque mousemove)
  if (_propLayer) { map.removeLayer(_propLayer); _propLayer = null; }

  function onMouseMove(e) {
    var mapEl   = map.getContainer();
    var mapRect = mapEl.getBoundingClientRect();
    var px = e.clientX - mapRect.left;
    var py = e.clientY - mapRect.top;
    var destLatLng = map.containerPointToLatLng([px, py]);

    // Supprimer l'ancienne flèche temporaire
    if (_propLayer) { map.removeLayer(_propLayer); _propLayer = null; }

    // Calculer l'angle par rapport au Nord
    var dLat = destLatLng.lat - lat;
    var dLon = destLatLng.lng - lon;
    var angleN = (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;

    // Tracer la flèche temporaire
    _propLayer = _drawArrow([lat, lon], [destLatLng.lat, destLatLng.lng], '#cc0000', true);

    // Afficher le label angle près de la pointe (position souris + décalage)
    var lbl = document.getElementById('prop-angle-label');
    if (lbl) {
      lbl.textContent = angleN.toFixed(0).padStart(3,'0') + '° N';
      lbl.style.display = 'block';
      lbl.style.left = (e.clientX + 14) + 'px';
      lbl.style.top  = (e.clientY - 28) + 'px';
    }
  }

  function onMouseUp(e) {
    document.removeEventListener('mousemove', onMouseMove);
    document.removeEventListener('mouseup',   onMouseUp);
    map.dragging.enable();
    // Masquer le label angle
    var lbl = document.getElementById('prop-angle-label');
    if (lbl) lbl.style.display = 'none';

    // Destination finale
    var mapEl   = map.getContainer();
    var mapRect = mapEl.getBoundingClientRect();
    var px = e.clientX - mapRect.left;
    var py = e.clientY - mapRect.top;
    var destLatLng = map.containerPointToLatLng([px, py]);

    // Supprimer temporaires
    map.removeLayer(originDot);
    if (_propLayer) { map.removeLayer(_propLayer); _propLayer = null; }

    // Créer la flèche définitive avec popup
    _finaliserPropagation(lat, lon, destLatLng.lat, destLatLng.lng,
                          dfci, container, slot, col);
  }

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup',   onMouseUp);
}

function _drawArrow(from, to, color, temporary) {
  // Calcule la pointe de flèche
  var p1 = map.latLngToContainerPoint(from);
  var p2 = map.latLngToContainerPoint(to);
  var dx = p2.x - p1.x, dy = p2.y - p1.y;
  var len = Math.sqrt(dx*dx + dy*dy);
  if (len < 8) return L.layerGroup().addTo(map);

  // Normaliser
  var nx = dx/len, ny = dy/len;
  // Pointe de flèche (légèrement en retrait par rapport à l'extrémité)
  var arrowSize = Math.min(24, len * 0.35);
  var tipPx = { x: p2.x, y: p2.y };
  var left  = map.containerPointToLatLng([
    tipPx.x - arrowSize*nx + arrowSize*0.5*ny,
    tipPx.y - arrowSize*ny - arrowSize*0.5*nx
  ]);
  var right = map.containerPointToLatLng([
    tipPx.x - arrowSize*nx - arrowSize*0.5*ny,
    tipPx.y - arrowSize*ny + arrowSize*0.5*nx
  ]);

  var group = L.layerGroup();
  // Trait principal
  L.polyline([from, to], {
    color: color, weight: 6, opacity: 0.85,
    lineCap:'round', interactive: !temporary
  }).addTo(group);
  // Tête de flèche (polygone triangulaire)
  L.polygon([to, [left.lat,left.lng], [right.lat,right.lng]], {
    color: color, fillColor: color, fillOpacity:1,
    weight:1, interactive: !temporary
  }).addTo(group);

  group.addTo(map);
  return group;
}

function _finaliserPropagation(fromLat, fromLon, toLat, toLon, dfci, container, slot, col) {
  var heure = new Date().toTimeString().slice(0,5);
  var slotTxt = slot ? ' <span style="color:' + col + ';font-weight:700;">S' + slot + '</span>' : '';
  var communeNom = container ? (container.getAttribute('data-commune') || '') : '';
  var communeLigne = communeNom
    ? '<div class="popup-row"><span class="lbl">Commune</span>'
      + '<span class="val" style="color:#e8a020;">' + communeNom + '</span></div>' : '';

  // Calculer l'angle de propagation (par rapport au Nord)
  var dLat = toLat - fromLat, dLon = toLon - fromLon;
  var angleNord = (Math.atan2(dLon, dLat) * 180 / Math.PI + 360) % 360;

  var popupHtml = '<div class="popup-inner" style="min-width:200px;">'
    + '<div class="popup-header">'
    + '<div class="popup-icon" style="background:#3a0000;font-size:18px;">&#x27A1;</div>'
    + '<div><div class="popup-title" style="color:#cc0000;">Propagation' + slotTxt + '</div>'
    + '<div class="popup-sub">' + dfci + ' &mdash; ' + heure
    + ' &mdash; ' + angleNord.toFixed(0) + '\u00b0 N</div></div>'
    + '</div>'
    + communeLigne
    + '<div class="popup-row"><span class="lbl">Origine</span>'
    + '<span class="val" style="font-size:11px;">' + fromLat.toFixed(4) + 'N ' + fromLon.toFixed(4) + 'E</span></div>'
    + '<div style="display:flex;gap:6px;justify-content:center;margin-top:8px;'
    + 'padding-top:6px;border-top:1px solid #2a3040;">'
    + '<button onclick="supprimerMarqueur(this)" data-type="propagation" data-slot="' + slot + '" '
    + 'style="background:#3a0a0a;border:1px solid #ef5350;border-radius:4px;color:#ef5350;'
    + 'font-family:Arial,sans-serif;font-size:12px;padding:4px 10px;cursor:pointer;">'
    + '&#10005; Supprimer</button>'
    + '<button onclick="supprimerGroupe(this.dataset.type,+this.dataset.slot)" '
    + 'data-type="propagation" data-slot="' + slot + '" '
    + 'style="background:#1a1f2e;border:1px solid #4a5570;border-radius:4px;color:#8a9bb0;'
    + 'font-family:Arial,sans-serif;font-size:12px;padding:4px 10px;cursor:pointer;">'
    + '&#10005;&#10005; Effacer groupe</button>'
    + '</div></div>';

  // ID unique pour la suppression
  var mkrId = Date.now() + Math.random();

  // Badge slot : petit label au-dessus de l'origine de la flèche
  var slotColor = slot && COULEURS[slot] ? COULEURS[slot].fill : '#ffffff';
  var badgeHtml = slot
    ? '<div style="background:' + slotColor + ';color:#fff;border:1.5px solid #fff;'
      + 'border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:700;'
      + 'display:flex;align-items:center;justify-content:center;font-family:Arial;">'
      + slot + '</div>'
    : '';
  var badgeMkr = L.marker([fromLat, fromLon], {
    icon: L.divIcon({ html: badgeHtml, className:'', iconSize:[16,16], iconAnchor:[8,20] }),
    interactive: false, zIndexOffset: 850
  }).addTo(map);

  // Injecter mkrId dans le bouton Supprimer du popup
  var popupFinal = popupHtml.replace(
    'onclick="supprimerMarqueur(this)"',
    'onclick="supprimerMarqueur(this)" data-mkrid="' + mkrId + '"'
  );

  // Flèche définitive
  var arrow = _drawArrow([fromLat,fromLon], [toLat,toLon], '#cc0000', false);

  // Ajouter popup sur le clic de la flèche
  arrow.eachLayer(function(layer) {
    layer.bindPopup(popupFinal, { className:'custom-popup', maxWidth:240 });
    layer.on('click', function() { layer.openPopup(); });
  });

  // Stocker coordonnées pour drag
  var dLat = toLat - fromLat;
  var dLon = toLon - fromLon;

  arrow._tactiqueId   = mkrId;
  arrow._tactiqueType = 'propagation';
  arrow._tactiqueSlot = slot;
  arrow._badgeMkr     = badgeMkr;
  arrow._fromLat = fromLat; arrow._fromLon = fromLon;
  arrow._toLat   = toLat;   arrow._toLon   = toLon;
  arrow._dLat    = dLat;    arrow._dLon    = dLon;

  // Drag via badgeMkr (déjà à l'origine) — rendu draggable
  // Badge slot : purement visuel, non-interactif
  arrow._badgeMkr = badgeMkr;

  // Handle de drag : marker minimaliste sur l'origine (cursor move, zIndex bas)
  var propDragHandle = L.marker([fromLat, fromLon], {
    icon: L.divIcon({
      html: '<div style="width:14px;height:14px;border-radius:50%;'
          + 'background:rgba(204,0,0,0.5);border:2px solid #cc0000;'
          + 'cursor:move;box-sizing:border-box;"></div>',
      className: '', iconSize:[14,14], iconAnchor:[7,7]
    }),
    draggable: true,
    interactive: true,
    zIndexOffset: 800   // sous la flèche pour ne pas bloquer les clics
  }).addTo(map);
  arrow._propDragHandle = propDragHandle;

  propDragHandle.on('dragstart', function() { map.closePopup(); });
  propDragHandle.on('drag', function(ev) {
    var nf = ev.target.getLatLng();
    // Translation : recalculer destination
    var nt = L.latLng(nf.lat + arrow._dLat, nf.lng + arrow._dLon);
    // Supprimer anciens layers de la flèche (sans toucher au LayerGroup arrow)
    arrow.eachLayer(function(l) { map.removeLayer(l); });
    arrow.clearLayers();
    // Redessiner — on construit les layers manuellement sans addTo(map)
    var p1 = map.latLngToContainerPoint(nf);
    var p2 = map.latLngToContainerPoint(nt);
    var dx = p2.x-p1.x, dy = p2.y-p1.y;
    var len = Math.sqrt(dx*dx+dy*dy);
    if (len >= 8) {
      var nx=dx/len, ny=dy/len;
      var as = Math.min(24, len*0.35);
      var left  = map.containerPointToLatLng([p2.x-as*nx+as*0.5*ny, p2.y-as*ny-as*0.5*nx]);
      var right = map.containerPointToLatLng([p2.x-as*nx-as*0.5*ny, p2.y-as*ny+as*0.5*nx]);
      var line = L.polyline([[nf.lat,nf.lng],[nt.lat,nt.lng]],
        {color:'#cc0000',weight:6,opacity:0.85,lineCap:'round'});
      var head = L.polygon([[nt.lat,nt.lng],[left.lat,left.lng],[right.lat,right.lng]],
        {color:'#cc0000',fillColor:'#cc0000',fillOpacity:1,weight:1});
      line.bindPopup(popupFinal,{className:'custom-popup',maxWidth:240});
      line.on('click',function(){line.openPopup();});
      head.bindPopup(popupFinal,{className:'custom-popup',maxWidth:240});
      head.on('click',function(){head.openPopup();});
      arrow.addLayer(line);
      arrow.addLayer(head);
      arrow.addTo(map);
    }
    // Déplacer le badge
    if (arrow._badgeMkr) arrow._badgeMkr.setLatLng(nf);
  });
  propDragHandle.on('dragend', function(ev) {
    var nf = ev.target.getLatLng();
    arrow._fromLat = nf.lat; arrow._fromLon = nf.lng;
    arrow._toLat   = nf.lat + arrow._dLat;
    arrow._toLon   = nf.lng + arrow._dLon;
  });

  // Stocker toujours dans marqueursSlot (slot=0 si pas de slot actif)
  if (!marqueursSlot[slot]) marqueursSlot[slot] = {};
  if (!marqueursSlot[slot].propagation) marqueursSlot[slot].propagation = [];
  marqueursSlot[slot].propagation.push(arrow);
}

function supprimerMarqueur(btn) {
  var type  = btn.getAttribute('data-type');
  var slot  = parseInt(btn.getAttribute('data-slot')) || 0;
  var mkrId = parseFloat(btn.getAttribute('data-mkrid'));
  // Retrouver le marqueur par son ID unique
  var slots = slot ? [slot] : [0, 1, 2, 3, 4];
  slots.forEach(function(s) {
    if (!marqueursSlot[s] || !marqueursSlot[s][type]) return;
    marqueursSlot[s][type] = marqueursSlot[s][type].filter(function(mkr) {
      if (mkr._tactiqueId === mkrId) {
        if (mkr._badgeMkr)      map.removeLayer(mkr._badgeMkr);
        if (mkr._propDragHandle) map.removeLayer(mkr._propDragHandle);
        if (mkr.eachLayer) { mkr.eachLayer(function(l){ map.removeLayer(l); }); }
        map.removeLayer(mkr);
        return false;
      }
      return true;
    });
  });
  // Fermer le popup APRÈS la suppression
  setTimeout(function() { map.closePopup(); }, 50);
}

function supprimerTousMarqueurs(slot) {
  if (!slot) return;
  Object.keys(marqueursSlot[slot]).forEach(function(type) {
    marqueursSlot[slot][type].forEach(function(mkr) { map.removeLayer(mkr); });
    marqueursSlot[slot][type] = [];
  });
}

function supprimerGroupe(type, slot) {
  // Effacer tous les marqueurs d'un même type sur un même slot
  // Si slot=0 (pas de slot actif), effacer dans tous les slots
  var slots = (slot && slot > 0) ? [slot] : [0, 1, 2, 3, 4];
  console.log('[SuppGroupe] type=' + type + ' slot=' + slot + ' slots=' + JSON.stringify(slots));
  slots.forEach(function(s) {
    if (marqueursSlot[s] && marqueursSlot[s][type]) {
      console.log('[SuppGroupe] slot ' + s + ' -> ' + marqueursSlot[s][type].length + ' marqueur(s)');
      marqueursSlot[s][type].forEach(function(mkr) {
        if (mkr._badgeMkr)      map.removeLayer(mkr._badgeMkr);
        if (mkr._propDragHandle) map.removeLayer(mkr._propDragHandle);
        if (mkr.eachLayer) { mkr.eachLayer(function(l){ map.removeLayer(l); }); }
        map.removeLayer(mkr);
      });
      marqueursSlot[s][type] = [];
    }
  });
  // Fermer le popup APRÈS la suppression
  setTimeout(function() { map.closePopup(); }, 50);
}

document.addEventListener('DOMContentLoaded', function() {
  // Handler bouton Slot libre + clic droit code DFCI (module recherche détaillée)
  document.addEventListener('click', function(e) {
    var btnSend = e.target.closest('.sdp-send-dfci');
    if (btnSend) { sdpEnvoyerDFCI(btnSend.getAttribute('data-code')); return; }
  });
  document.addEventListener('contextmenu', function(e) {
    var span = e.target.closest('.sdp-dfci-code');
    if (!span) return;
    e.preventDefault();
    sdpEnvoyerDFCI(span.getAttribute('data-code'));
  });

  // Handler délégué pour les boutons tactiques dans les popups DFCI
  // CAPTURE=true : s'exécute AVANT Leaflet qui fermerait le popup sur mousedown
  document.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    var btn = e.target.closest('.tactique-btn[data-type]');
    if (!btn) return;
    var container = btn.closest('.tactique-btns');
    if (!container) return;
    // Lire toutes les données AVANT que Leaflet ferme le popup
    var lat  = parseFloat(container.getAttribute('data-lat'));
    var lon  = parseFloat(container.getAttribute('data-lon'));
    var dfci = container.getAttribute('data-dfci');
    var comm = container.getAttribute('data-commune') || '';
    var type = btn.getAttribute('data-type');
    // Empêcher Leaflet de fermer le popup avant qu'on ait terminé
    e.stopPropagation();
    e.preventDefault();
    if (type === 'engagement') {
      initRotationMode(type, lat, lon, dfci, container, btn);
    } else if (type === 'propagation') {
      initPropagationMode(lat, lon, dfci, container, btn);
    } else {
      // Fermer le popup manuellement après avoir lu les données
      setTimeout(function() { map.closePopup(); }, 10);
      deposerMarqueur(type, lat, lon, dfci, container);
    }
  }, true);  // true = capture phase — avant Leaflet
  document.addEventListener('click', function(e) {
    // Effacer groupe
    var btnG = e.target.closest('.btn-suppr-groupe');
    if (btnG) {
      supprimerGroupe(btnG.getAttribute('data-type'), parseInt(btnG.getAttribute('data-slot')) || 0);
    }
  });

  initAutoComplete(1);
  initAutoComplete(2);
  initAutoComplete(3);
  initAutoComplete(4);
  initCommuneSearch();
  document.addEventListener('click', function(e) {
    [1,2,3,4].forEach(function(n) {
      var inp = document.getElementById('dfci-input-'+n);
      var box = inp ? inp.closest('.dfci-search-box') : null;
      if (box && !box.contains(e.target)) {
        var sugg = document.getElementById('dfci-sugg-'+n);

function buildSelectHTML(opts, selVal, id, onchange) {
  var html = '<select class="ic-select" id="'+id+'" onchange="'+onchange+'">';
  opts.forEach(function(o) {
    html += '<option value="'+o.val+'"'+(o.val===selVal?' selected':'')+'>'+o.label+'</option>';
  });
  html += '</select>';
  return html;
}

function getStatutClass(statutA) {
  var map = {
    'signale':'ic-statut-signale', 'confirme':'ic-statut-confirme',
    'traitement':'ic-statut-traitement', 'encours':'ic-statut-encours',
    'noyage':'ic-statut-noyage', 'termine':'ic-statut-termine'
  };
  return map[statutA] || 'ic-statut-default';
}

function icInput(n, field, placeholder, val) {
  // Génère un input sans onchange inline — le handler est délégué sur #incidents-panel
  return '<input class="ic-cell-input" data-n="'+n+'" data-field="'+field+'"'
       + ' value="'+val+'" placeholder="'+placeholder+'"/>';
}

function renderIncidentsPanel() {
  if (!modeDemo) return; // Uniquement en mode DEMO
  var panel = document.getElementById('incidents-panel');
  if (!panel) return;

  // Trier les slots actifs par priorité statut A, puis chronologique
  var slots = [1,2,3,4].filter(function(n){ return !!incidentData[n].code; });
  slots.sort(function(a,b) {
    var pa = STATUT_A_PRIORITE[incidentData[a].statutA] || 99;
    var pb = STATUT_A_PRIORITE[incidentData[b].statutA] || 99;
    if (pa !== pb) return pa - pb;
    return (incidentData[a].ts || 0) - (incidentData[b].ts || 0);
  });

  panel.innerHTML = slots.map(function(n){ return renderIncidentCard(n); }).join('');

  // Handler délégué pour tous les inputs — évite les onchange inline avec apostrophes
  panel.querySelectorAll('.ic-cell-input[data-field]').forEach(function(el) {
    el.addEventListener('change', function() {
      saveField(parseInt(this.dataset.n), this.dataset.field, this.value);
    });
  });
}

function ouvrirIncident(n, code, commune) {
  if (!modeDemo) return; // Uniquement en mode DEMO
  incidentData[n].code    = code;
  incidentData[n].commune = commune || '';
  if (!incidentData[n].ts) incidentData[n].ts = Date.now();
  renderIncidentsPanel();
}

function toggleCollapseCard(n) {
  incidentData[n].collapsed = !incidentData[n].collapsed;

function fermerIncident(n) {

// dfci_official.js définit DFCI_2KM et DFCI_20KM — on attend qu'ils soient dispo
(function waitDFCI() {
  var bar = document.getElementById('dfci-loading-bar');
  var btn = document.getElementById('pin-entree-btn');

  function check() {
    // Vérification stricte : objets présents ET features complètement chargées
    // DFCI_2KM = 3827 carreaux — seuil 3000 pour garantir le chargement complet
    var ok2km  = (typeof DFCI_2KM  !== 'undefined' && DFCI_2KM  !== null
                  && DFCI_2KM.features  && DFCI_2KM.features.length  >= 3000);
    var ok20km = (typeof DFCI_20KM !== 'undefined' && DFCI_20KM !== null
                  && DFCI_20KM.features && DFCI_20KM.features.length >= 10);

    if (ok2km && ok20km) {
      // DFCI chargé — débloquer le bouton
      if (btn) {
        btn.disabled = false;
        btn.textContent = 'ENTRER';
      }
      if (bar) {
        bar.innerHTML = '&#x2714;&nbsp;Données DFCI prêtes — ' + DFCI_2KM.features.length + ' carreaux';
        bar.classList.add('pret');
        // Masquer après 3 secondes
        setTimeout(function() { bar.style.opacity = '0'; }, 3000);
      }
      // Focus automatique sur le champ PIN
      setTimeout(function() {
        var inp = document.getElementById('pin-entree-input');
        if (inp) inp.focus();
      }, 100);
    } else {
      // Pas encore prêt — réessayer dans 200ms
      if (bar) {
        // Animer le message pour montrer que ça charge
        var dots = (bar._dots || 0) % 4;
        bar._dots = dots + 1;
        var d = '.'.repeat(dots);
        var nb2km = (typeof DFCI_2KM !== 'undefined' && DFCI_2KM && DFCI_2KM.features)
                    ? DFCI_2KM.features.length : 0;
        var progTxt = nb2km > 0 ? ' (' + nb2km + '/3827)' : '';
        bar.innerHTML = '<span class="dfci-spinner"></span>Chargement données DFCI' + progTxt + d;
      }
      setTimeout(check, 200);
    }
  }

  // Démarrer la vérification après le chargement de la page
  if (document.readyState === 'complete') {
    check();
  } else {
    window.addEventListener('load', check);
  }
})();

var WMS_BASE = 'https://carto.tre.telealerte.net/mapserver/18712001/wms-admin/';

var wmsLayers = {
  patrouille:     null,
  patrouille_txt: null,
  vigie:          null
};
var wmsVisible = {
  patrouille:     false,
  patrouille_txt: false,
  vigie:          false
};

var WMS_CONFIG = {
  patrouille:     { layer: 'info_patrouille',     btn: 'btn-wms-patrouille',     label: 'Patrouilles actives' },
  patrouille_txt: { layer: 'info_patrouille_txt', btn: 'btn-wms-patrouille-txt', label: 'Détail patrouilles' },
  vigie:          { layer: 'info_vigie',           btn: 'btn-wms-vigie',          label: 'Vigies live (CII)' }
};

function toggleWMS(key) {
  var cfg = WMS_CONFIG[key];
  var btn = document.getElementById(cfg.btn);
  if (wmsVisible[key]) {
    // Masquer
    if (wmsLayers[key]) { map.removeLayer(wmsLayers[key]); wmsLayers[key] = null; }
    wmsVisible[key] = false;
    if (btn) btn.classList.remove('active');
  } else {
    // Afficher
    wmsLayers[key] = L.tileLayer.wms(WMS_BASE, {
      layers:      cfg.layer,
      format:      'image/png',
      transparent: true,
      version:     '1.3.0',
      opacity:     0.9
    });
    wmsLayers[key].addTo(map);
    wmsVisible[key] = true;
    if (btn) btn.classList.add('active');

    // Programmer le refresh toutes les 300s
    wmsLayers[key]._refreshTimer = setInterval(function() {
      if (!wmsVisible[key]) return;
      map.removeLayer(wmsLayers[key]);
      wmsLayers[key] = L.tileLayer.wms(WMS_BASE, {
        layers: cfg.layer, format: 'image/png',
        transparent: true, version: '1.3.0', opacity: 0.9
      }).addTo(map);
    }, 300000);
  }
}

// Nettoyer les timers WMS si la couche est retirée
function clearWMSTimers() {
  Object.keys(wmsLayers).forEach(function(key) {
    if (wmsLayers[key] && wmsLayers[key]._refreshTimer) {
      clearInterval(wmsLayers[key]._refreshTimer);
    }
  });
}

// ── Recherche commune dans le panneau ─────────────────────────────────────────
(function() {
  var inp, sugg;
  document.addEventListener('DOMContentLoaded', function() {
    inp  = document.getElementById('sdp-commune-input');
    sugg = document.getElementById('sdp-commune-sugg');
    if (!inp) return;

    inp.addEventListener('input', function() {
      var val = this.value.trim().toLowerCase();
      sugg.innerHTML = '';
      if (val.length < 2) { sugg.style.display='none'; return; }
      var matches = COMMUNES_VAR.filter(function(c) {
        return c.nom.toLowerCase().indexOf(val) !== -1;
      }).sort(function(a, b) {
        var ai = a.nom.toLowerCase().indexOf(val);
        var bi = b.nom.toLowerCase().indexOf(val);
        return ai - bi;
      }).slice(0, 10);

      if (!matches.length) { sugg.style.display='none'; return; }
      matches.forEach(function(cm) {
        var div = document.createElement('div');
        div.className = 'dfci-sugg-item';
        div.textContent = cm.nom;
        div.addEventListener('click', function() {
          inp.value = cm.nom;
          sugg.style.display = 'none';
          sdpSelectCommune(cm);
        });
        sugg.appendChild(div);
      });
      sugg.style.display = 'block';
    });

    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') sugg.style.display = 'none';
    });

    document.addEventListener('click', function(e) {
      if (inp && !inp.contains(e.target) && sugg && !sugg.contains(e.target))
        sugg.style.display = 'none';
    });
  });
})();

function sdpSelectCommune(cm) {
  sdpCommuneSelect = cm;
  map.setView([cm.lat, cm.lon], 14);
  var ctx = document.getElementById('sdp-commune-context');
  ctx.textContent = '📍 ' + cm.nom + ' — saisir une adresse ci-dessous';
  ctx.style.display = 'block';
  document.getElementById('sdp-results').innerHTML = '';

  // Récupérer le code INSEE pour filtrage BAN strict
  if (!cm.insee) {
    fetch('https://geo.api.gouv.fr/communes?nom=' + encodeURIComponent(cm.nom)
          + '&fields=code&format=json&limit=1')
      .then(function(r){ return r.json(); })
      .then(function(data) {
        if (data && data.length > 0) {
          sdpCommuneSelect.insee = data[0].code;
          ctx.textContent = '📍 ' + cm.nom + ' (' + data[0].code + ') — saisir une adresse';
        }
      })
      .catch(function(){});
  }

  setTimeout(function() {
    document.getElementById('sdp-addr-input').focus();
  }, 100);
}

// ── Recherche adresse / lieu-dit ──────────────────────────────────────────────
function sdpSearchAddr() {
  var val = document.getElementById('sdp-addr-input').value.trim();
  if (!val) return;
  var results = document.getElementById('sdp-results');
  results.innerHTML = '<div class="sdp-loading"><span class="dfci-spinner" style="display:inline-block;vertical-align:middle;margin-right:6px"></span>Recherche...</div>';

  // Auto-sélection : si le champ commune a du texte mais sdpCommuneSelect est null
  // → chercher une correspondance exacte dans COMMUNES_VAR
  if (!sdpCommuneSelect) {
    var cinp = document.getElementById('sdp-commune-input');
    if (cinp && cinp.value.trim().length > 1) {
      var val2 = cinp.value.trim().toLowerCase();
      var found = COMMUNES_VAR.find(function(cm) {
        return cm.nom.toLowerCase() === val2;
      });
      if (!found) found = COMMUNES_VAR.find(function(cm) {
        return cm.nom.toLowerCase().indexOf(val2) === 0;
      });
      if (found) {
        sdpSelectCommune(found);
        // sdpCommuneSelect est maintenant défini
      }
    }
  }

  var VAR_BBOX = {minLon:5.67, minLat:42.98, maxLon:7.72, maxLat:43.93};
  var commune  = sdpCommuneSelect ? sdpCommuneSelect.nom : '';
  var clat     = sdpCommuneSelect ? sdpCommuneSelect.lat : 43.4;
  var clon     = sdpCommuneSelect ? sdpCommuneSelect.lon : 6.2;

  // Avec commune : bbox ±6km (0.06° lat/lon ≈ 5-6km dans le Var)
  var dd = 0.06;
  var bboxMinLon = sdpCommuneSelect ? Math.max(clon-dd, VAR_BBOX.minLon) : VAR_BBOX.minLon;
  var bboxMinLat = sdpCommuneSelect ? Math.max(clat-dd, VAR_BBOX.minLat) : VAR_BBOX.minLat;
  var bboxMaxLon = sdpCommuneSelect ? Math.min(clon+dd, VAR_BBOX.maxLon) : VAR_BBOX.maxLon;
  var bboxMaxLat = sdpCommuneSelect ? Math.min(clat+dd, VAR_BBOX.maxLat) : VAR_BBOX.maxLat;

  // ── Source 1 : BAN ── citycode strict si commune connue ──────────────────
  var banUrl;
  if (sdpCommuneSelect && sdpCommuneSelect.insee) {
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val) + '&limit=8&autocomplete=0'
      + '&citycode=' + sdpCommuneSelect.insee;
  } else if (sdpCommuneSelect) {
    // INSEE pas encore chargé — filtre lat/lon serré
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val) + '&limit=8&autocomplete=0'
      + '&lat=' + clat + '&lon=' + clon;
  } else {
    banUrl = 'https://api-adresse.data.gouv.fr/search/?q='
      + encodeURIComponent(val + ' 83') + '&limit=5&autocomplete=0'
      + '&lat=43.4&lon=6.2';
  }

  // ── Source 2 : IGN — toponymies SCAN25, bbox stricte ─────────────────────
  // Requête sans le nom commune pour éviter la dérive géographique
  var ignUrl = 'https://data.geopf.fr/geocodage/search?q='
    + encodeURIComponent(val)
    + '&index=PositionOfInterest&limit=8'
    + '&bbox=' + bboxMinLon + ',' + bboxMinLat + ',' + bboxMaxLon + ',' + bboxMaxLat;

  // ── Source 3 : Nominatim — bounded strict ────────────────────────────────
  var nomViewbox = sdpCommuneSelect
    ? (bboxMinLon+','+bboxMaxLat+','+bboxMaxLon+','+bboxMinLat)
    : (VAR_BBOX.minLon+','+VAR_BBOX.maxLat+','+VAR_BBOX.maxLon+','+VAR_BBOX.minLat);
  var nomQuery = sdpCommuneSelect
    ? val + ' ' + commune         // avec commune → plus précis
    : val + ' Var';
  var nomUrl = 'https://nominatim.openstreetmap.org/search?format=json&limit=4'
    + '&q=' + encodeURIComponent(nomQuery)
    + '&viewbox=' + nomViewbox + '&bounded=1&accept-language=fr';

  var done = 0;
  var banR = [], ignR = [], nomR = [];

  function merge() {
    done++;
    if (done < 3) return;
    var all = [];
    var SC = {BAN:'#4caf50', IGN:'#e8a020', OSM:'#7ab3f0'};
    var ST = {BAN:'Adresse officielle', IGN:'Toponymie IGN/SCAN25', OSM:'OpenStreetMap'};

    banR.forEach(function(f) {
      if (!f.geometry) return;
      var tl = {housenumber:'Adresse',street:'Rue',locality:'Lieu-dit',
                municipality:'Commune'}[f.properties.type] || f.properties.type;
      all.push({
        name: f.properties.label,
        sub:  f.properties.city && f.properties.city !== f.properties.label
              ? f.properties.city : (f.properties.context || ''),
        type: tl, lat: f.geometry.coordinates[1],
        lon:  f.geometry.coordinates[0], src: 'BAN'
      });
    });

    ignR.forEach(function(f) {
      if (!f.geometry) return;
      var lt = f.geometry.coordinates[1], ln = f.geometry.coordinates[0];
      // Filtrage strict bbox
      if (lt < bboxMinLat || lt > bboxMaxLat || ln < bboxMinLon || ln > bboxMaxLon) return;
      if (all.some(function(a){return Math.abs(a.lat-lt)<0.001 && Math.abs(a.lon-ln)<0.001;})) return;
      var p = f.properties;
      all.push({
        name: p.label || p.name || p.toponym || '',
        sub:  p.city || p.municipality || '',
        type: p.type || 'Lieu IGN',
        lat:  lt, lon: ln, src: 'IGN'
      });
    });

    nomR.forEach(function(r) {
      var lt = parseFloat(r.lat), ln = parseFloat(r.lon);
      // Filtrage strict bbox : rejeter tout résultat hors de la zone cible
      if (lt < bboxMinLat || lt > bboxMaxLat || ln < bboxMinLon || ln > bboxMaxLon) return;
      if (all.some(function(a){return Math.abs(a.lat-lt)<0.002 && Math.abs(a.lon-ln)<0.002;})) return;
      var pts = r.display_name.split(',');
      all.push({
        name: pts[0].trim(), sub: pts.slice(1,3).join(',').trim(),
        type: r.type || 'lieu', lat: lt, lon: ln, src: 'OSM'
      });
    });

    if (!all.length) {
      results.innerHTML = '<div class="sdp-empty">Aucun resultat</div>';
      return;
    }
    results.innerHTML = '';
    all.slice(0, 12).forEach(function(item) {
      var dfciCode = '';
      if (typeof DFCI_2KM !== 'undefined') {
        var best = null, bd = 999;
        DFCI_2KM.features.forEach(function(f) {
          var d = (f.properties.cx-item.lon)*(f.properties.cx-item.lon)
                + (f.properties.cy-item.lat)*(f.properties.cy-item.lat);
          if (d < bd) { bd = d; best = f; }
        });
        if (best) dfciCode = best.properties.c;
      }
      var col = SC[item.src] || '#8a9bb0';
      var div = document.createElement('div');
      div.className = 'sdp-result-item';
      div.innerHTML =
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;">'
        + '<div class="sdp-result-name">' + item.name + '</div>'
        + '<span style="font-size:10px;color:'+col+';background:'+col+'22;'
        + 'border-radius:3px;padding:1px 5px;flex-shrink:0;margin-left:6px;'
        + 'font-family:Barlow Condensed,sans-serif;" title="'+(ST[item.src]||item.src)+'">'
        + item.src + '</span></div>'
        + (item.sub ? '<div class="sdp-result-sub">'+item.sub+'</div>' : '')
        + (dfciCode ? '<div class="sdp-result-dfci">&#128208; '+dfciCode+'</div>' : '');
      div.addEventListener('click', function() { sdpGoToResult(item, dfciCode); });
      results.appendChild(div);
    });
  }

  fetch(banUrl)
    .then(function(r){return r.json();})
    .then(function(d){banR=d.features||[];merge();})
    .catch(function(){merge();});
  fetch(ignUrl)
    .then(function(r){return r.json();})
    .then(function(d){ignR=d.features||[];merge();})
    .catch(function(){merge();});
  fetch(nomUrl, {headers:{'User-Agent':'HARPON83-CCFF-Var/1.0'}})
    .then(function(r){return r.json();})
    .then(function(d){nomR=d||[];merge();})
    .catch(function(){merge();});
}

  popupHtml += dfciBlock + '</div>';

  window._sdpLastMarker = L.circleMarker([item.lat, item.lon], {
    radius: 9, color: '#e85d26', fillColor: '#ff8c00', fillOpacity: 0.9, weight: 2
  }).bindPopup(popupHtml, {className: 'custom-popup', maxWidth: 260})
    .addTo(map)
    .openPopup();

}

// Envoyer un code DFCI dans le premier slot libre S1-S4
function sdpEnvoyerDFCI(code) {
  var slots = [1, 2, 3, 4];
  var target = null;
  for (var i = 0; i < slots.length; i++) {
    var n = slots[i];
    var inp = document.getElementById('dfci-input-' + n);
    if (inp && (!inp.value.trim() || !dfciState[n].highlight)) {
      target = n;
      break;
    }
  }
  if (target === null) target = 1; // tous occupés → S1
  var inp = document.getElementById('dfci-input-' + target);
  if (inp) {
    inp.value = code;
    dfciSearch(target);
    map.closePopup();
    // Flash visuel sur le label du slot
    var label = document.querySelector('.dfci-search-label.s' + target);
    if (label) {
      var orig = label.style.background;
      var origC = label.style.color;
      label.style.background = '#e85d26';
      label.style.color = '#fff';
      setTimeout(function() { label.style.background = orig; label.style.color = origC; }, 900);
    }
  }
}

function supprimerMarqueur(btn) {
  var type  = btn.getAttribute('data-type');
  var slot  = parseInt(btn.getAttribute('data-slot')) || 0;
  var mkrId = parseFloat(btn.getAttribute('data-mkrid'));
  // Retrouver le marqueur par son ID unique
  var slots = slot ? [slot] : [0, 1, 2, 3, 4];
  slots.forEach(function(s) {
    if (!marqueursSlot[s] || !marqueursSlot[s][type]) return;
    marqueursSlot[s][type] = marqueursSlot[s][type].filter(function(mkr) {
      if (mkr._tactiqueId === mkrId) {
        if (mkr._badgeMkr) map.removeLayer(mkr._badgeMkr);
        if (mkr.eachLayer) { mkr.eachLayer(function(l){ map.removeLayer(l); }); }
        map.removeLayer(mkr);
        return false;
      }
      return true;
    });
  });
  // Fermer le popup APRÈS la suppression
  setTimeout(function() { map.closePopup(); }, 50);
}

function supprimerTousMarqueurs(slot) {
  if (!slot) return;
  Object.keys(marqueursSlot[slot]).forEach(function(type) {
    marqueursSlot[slot][type].forEach(function(mkr) { map.removeLayer(mkr); });
    marqueursSlot[slot][type] = [];
  });
}

function supprimerGroupe(type, slot) {
  // Effacer tous les marqueurs d'un même type sur un même slot
  // Si slot=0 (pas de slot actif), effacer dans tous les slots
  var slots = (slot && slot > 0) ? [slot] : [0, 1, 2, 3, 4];
  console.log('[SuppGroupe] type=' + type + ' slot=' + slot + ' slots=' + JSON.stringify(slots));
  slots.forEach(function(s) {
    if (marqueursSlot[s] && marqueursSlot[s][type]) {
      console.log('[SuppGroupe] slot ' + s + ' -> ' + marqueursSlot[s][type].length + ' marqueur(s)');
      marqueursSlot[s][type].forEach(function(mkr) {
        if (mkr._badgeMkr) map.removeLayer(mkr._badgeMkr);
        if (mkr.eachLayer) { mkr.eachLayer(function(l){ map.removeLayer(l); }); }
        map.removeLayer(mkr);
      });
      marqueursSlot[s][type] = [];
    }
  });
  // Fermer le popup APRÈS la suppression
  setTimeout(function() { map.closePopup(); }, 50);
}

function setBandeauChantier(code) {
  var el = document.getElementById('bandeau-chantier');
  if (!el) return;
  var now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  el.textContent = code + ' — ' + now;
  el.style.color = '#ff3333';
  el.style.borderColor = '#ff3333';
  var dot = document.getElementById('statut-dot');
  var txt = document.getElementById('statut-txt');
  if (dot) dot.style.background = '#4caf50';
  if (txt) txt.textContent = 'Chantier actif';
}

function ouvrirIncident(n, code, info) {
  // Stub HARPON — mettre à jour le bandeau chantier
  if (n === 1 && code) {
    setBandeauChantier(code);
  }
}

function dfciClearSearch(n) {
  var inp = document.getElementById('dfci-input-'+n);
  if (inp) inp.value = '';
  var sugg = document.getElementById('dfci-sugg-'+n);
  if (sugg) { sugg.style.display='none'; sugg.innerHTML=''; }
  if (dfciState[n]) {
    if (dfciState[n].highlight)    { map.removeLayer(dfciState[n].highlight);    dfciState[n].highlight=null; }
    if (dfciState[n].marker)       { map.removeLayer(dfciState[n].marker);       dfciState[n].marker=null; }
    if (dfciState[n].commune)      { map.removeLayer(dfciState[n].commune);      dfciState[n].commune=null; }
    if (dfciState[n].communeLabel) { map.removeLayer(dfciState[n].communeLabel); dfciState[n].communeLabel=null; }
  }
  document.getElementById('bandeau-chantier').textContent = 'Aucun chantier actif';
  document.getElementById('bandeau-chantier').style.color = '#7ab3f0';
}

// Mise à jour bandeau après recherche réussie
var _origDfciSearch = dfciSearch;
function dfciSearchHarpon(n) {
  var val = document.getElementById('dfci-input-'+n).value.trim();
  _origDfciSearch(n);
  if (val) {
    setTimeout(function() {
      if (dfciState[1].highlight) {
        var now = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('bandeau-chantier').textContent = val.toUpperCase() + ' — ' + now;
        document.getElementById('bandeau-chantier').style.color = '#ff3333';
        document.getElementById('statut-txt').textContent = 'Chantier actif';
        document.getElementById('statut-dot').style.background = '#4caf50';
      }
    }, 600);
  }
}
document.getElementById('btn-go').onclick = function() { dfciSearchHarpon(1); };

  // Handler bouton Slot libre + clic droit code DFCI (module recherche détaillée)
  document.addEventListener('click', function(e) {
    var btnSend = e.target.closest('.sdp-send-dfci');
    if (btnSend) { sdpEnvoyerDFCI(btnSend.getAttribute('data-code')); return; }
  });
  document.addEventListener('contextmenu', function(e) {
